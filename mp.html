<body class="bg-slate-100 pb-32 font-sans"> <main class="p-6 space-y-6">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-md">
            <h2 class="text-xl font-black mb-6 uppercase tracking-tighter">Novo Artigo</h2>
            
            <div class="space-y-4">
                <input type="text" id="nome-mp" placeholder="Nome do Artigo" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-200 focus:border-orange-500 outline-none font-bold">
                
                <div class="flex gap-2">
                    <input type="number" id="preco-mp" placeholder="Preço (€)" class="flex-1 p-4 bg-slate-50 rounded-2xl border border-slate-200 focus:border-orange-500 outline-none font-bold">
                    <select id="unidade-mp" class="w-28 p-4 bg-slate-50 rounded-2xl border border-slate-200 font-bold text-xs uppercase">
                        <option value="kg">KG</option>
                        <option value="unid">UNID</option>
                        <option value="lt">LT</option>
                    </select>
                </div>

                <p class="text-[10px] font-black uppercase text-slate-400 mt-4">Fornecedor Principal</p>
                <select id="select-fornecedor" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-200 font-bold outline-none">
                    <option value="">A carregar fornecedores...</option>
                </select>

                <button onclick="salvarArtigo()" class="w-full bg-slate-900 text-white p-5 rounded-[2rem] font-black uppercase tracking-widest mt-6">Guardar Artigo</button>
            </div>
        </div>
    </main>

    <script>
        // Carrega fornecedores ao abrir a página
        async function carregarFornecedores() {
            const { data } = await _supabase.from('Fornecedores').select('*').order('nome');
            const select = document.getElementById('select-fornecedor');
            select.innerHTML = '<option value="">Seleccione o Fornecedor</option>' + 
                data.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
        }

        async function salvarArtigo() {
            const nome = document.getElementById('nome-mp').value;
            const preco = document.getElementById('preco-mp').value;
            const unid = document.getElementById('unidade-mp').value;
            const fornecedor = document.getElementById('select-fornecedor').value;

            const { error } = await _supabase.from('materias_primas').insert([{
                nome: nome,
                preco_atual: parseFloat(preco),
                unidade: unid,
                fornecedor_id: fornecedor ? parseInt(fornecedor) : null
            }]);

            if(!error) { alert("Artigo Guardado!"); window.location.reload(); }
        }
        document.addEventListener('DOMContentLoaded', carregarFornecedores);
    </script>
</body>
