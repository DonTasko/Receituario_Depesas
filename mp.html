<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#F8FAFC] pb-40 font-sans">
    <header class="p-6">
        <h1 class="text-3xl font-black text-slate-900 tracking-tighter">Stock</h1>
        <p class="text-slate-500 text-sm font-medium">Gestão de Matérias-Primas</p>
    </header>

    <main class="px-6 space-y-4">
        <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-orange-100 rounded-2xl flex items-center justify-center text-orange-600">
                    <i class="fa-solid fa-cow"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 text-sm">Picanha Argentina</h3>
                    <p class="text-[10px] text-slate-400 font-black uppercase">Talho do Mercado</p>
                </div>
            </div>
            <div class="text-right">
                <p class="font-black text-slate-900">25.50€/kg</p>
                <p class="text-[9px] text-red-500 font-bold uppercase"><i class="fa-solid fa-arrow-up"></i> 12%</p>
            </div>
        </div>

        <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600">
                    <i class="fa-solid fa-bottle-water"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 text-sm">Água 1.5L</h3>
                    <p class="text-[10px] text-slate-400 font-black uppercase">Distribuidora Bebidas</p>
                </div>
            </div>
            <div class="text-right">
                <p class="font-black text-slate-900">0.45€/un</p>
                <p class="text-[9px] text-emerald-500 font-bold uppercase">Estável</p>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl border border-white/10 z-50">
        <a href="index.html" class="flex flex-col items-center"><i class="fa-solid fa-house text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Início</span></a>
        <a href="mp.html" class="flex flex-col items-center"><i class="fa-solid fa-box-open text-orange-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-orange-400">Stock</span></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-[#F8FAFC] flex items-center justify-center shadow-lg active:scale-90 transition-transform"><i class="fa-solid fa-qrcode text-white text-2xl"></i></div></a>
        <a href="categorias.html" class="flex flex-col items-center"><i class="fa-solid fa-layer-group text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Categorias</span></a>
        <a href="receitas.html" class="flex flex-col items-center"><i class="fa-solid fa-utensils text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Receitas</span></a>
    </nav>
</body>
</html>
