<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Artigo - RestoCheck</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 pb-32 font-sans antialiased">

    <header class="p-6 bg-white border-b border-slate-200 sticky top-0 z-30">
        <h1 class="text-3xl font-black text-slate-900 tracking-tighter uppercase">Novo Artigo</h1>
        <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest">Gestão de Stock</p>
    </header>

    <main class="p-6 space-y-6">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
            <div class="space-y-4">
                <p class="text-[10px] font-black uppercase text-slate-400 ml-2">Detalhes do Produto</p>
                
                <input type="text" id="nome-mp" placeholder="Nome (Ex: Lombo Bacalhau)" 
                    class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-200 focus:border-orange-500 outline-none font-bold">
                
                <div class="flex gap-2">
                    <input type="number" id="preco-mp" placeholder="Preço (€)" 
                        class="flex-1 p-4 bg-slate-50 rounded-2xl border border-slate-200 focus:border-orange-500 outline-none font-bold">
                    <select id="unidade-mp" class="w-32 p-4 bg-slate-50 rounded-2xl border border-slate-200 font-bold text-xs">
                        <option value="kg">KG</option>
                        <option value="Unid">UNID</option>
                        <option value="Lt">LT</option>
                    </select>
                </div>

                <p class="text-[10px] font-black uppercase text-slate-400 mt-4 ml-2">Fornecedor Principal</p>
                <select id="select-fornecedor" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-200 font-bold outline-none appearance-none text-slate-600">
                    <option value="">A carregar fornecedores...</option>
                </select>

                <button onclick="salvarArtigo()" id="btn-save" 
                    class="w-full bg-slate-900 text-white p-5 rounded-[2rem] font-black uppercase tracking-widest mt-6 shadow-xl active:scale-95 transition-all">
                    Guardar Artigo
                </button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl z-50 text-slate-400">
        <a href="index.html" class="p-4"><i class="fa-solid fa-house"></i></a>
        <a href="mp.html" class="p-4 text-orange-400"><i class="fa-solid fa-box-open"></i></a>
        <a href="scan.html" class="relative -mt-14">
            <div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-100 flex items-center justify-center shadow-lg text-white"><i class="fa-solid fa-qrcode text-xl"></i></div>
        </a>
        <a href="categorias.html" class="p-4"><i class="fa-solid fa-layer-group"></i></a>
        <a href="lista_receitas.html" class="p-4"><i class="fa-solid fa-utersils"></i></a>
    </nav>

    <script>
        async function carregarFornecedores() {
            try {
                const { data, error } = await _supabase.from('Fornecedores').select('*').order('nome');
                if (error) throw error;
                const select = document.getElementById('select-fornecedor');
                select.innerHTML = '<option value="">Sem Fornecedor</option>' + 
                    data.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
            } catch (e) { console.error(e); }
        }

        async function salvarArtigo() {
            const btn = document.getElementById('btn-save');
            const nome = document.getElementById('nome-mp').value;
            const preco = document.getElementById('preco-mp').value;
            const unid = document.getElementById('unidade-mp').value;
            const forId = document.getElementById('select-fornecedor').value;

            if(!nome || !preco) return alert("Preenche os campos!");

            btn.innerText = "A GUARDAR...";
            btn.disabled = true;

            const { error } = await _supabase.from('materias_primas').insert([{
                nome: nome,
                preco_atual: parseFloat(preco),
                unidade: unid,
                fornecedor_id: forId ? parseInt(forId) : null
            }]);

            if (error) {
                alert("Erro ao salvar! Verifica se a coluna 'fornecedor_id' existe na tabela 'materias_primas'.");
                console.error(error);
                btn.innerText = "GUARDAR ARTIGO";
                btn.disabled = false;
            } else {
                alert("✅ Artigo criado!");
                window.location.reload();
            }
        }

        document.addEventListener('DOMContentLoaded', carregarFornecedores);
    </script>
</body>
</html>
