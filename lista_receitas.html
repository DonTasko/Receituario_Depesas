<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 pb-32 font-sans antialiased">

    <header class="p-8 bg-white border-b border-slate-200 sticky top-0 z-30 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black tracking-tighter uppercase text-slate-900">Fichas Técnicas</h1>
            <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Consulta de Custos</p>
        </div>
        <a href="criar_receita.html" class="w-12 h-12 bg-orange-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-orange-200 active:scale-90 transition-transform">
            <i class="fa-solid fa-plus text-xl"></i>
        </a>
    </header>

    <main class="p-6" id="lista-container">
        <div class="flex flex-col items-center justify-center py-20 text-slate-300">
            <i class="fa-solid fa-circle-notch animate-spin text-3xl mb-4"></i>
            <p class="text-[10px] font-black uppercase tracking-widest">A carregar receitas...</p>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl z-50 text-slate-400">
        <a href="index.html" class="p-4"><i class="fa-solid fa-house"></i></a>
        <a href="mp.html" class="p-4"><i class="fa-solid fa-box-open"></i></a>
        <a href="scan.html" class="relative -mt-14">
            <div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-100 flex items-center justify-center shadow-lg text-white text-xl">
                <i class="fa-solid fa-qrcode"></i>
            </div>
        </a>
        <a href="categorias.html" class="p-4"><i class="fa-solid fa-layer-group"></i></a>
        <a href="lista_receitas.html" class="p-4 text-orange-400"><i class="fa-solid fa-utensils"></i></a>
    </nav>

    <script>
        async function carregarReceitas() {
            const container = document.getElementById('lista-container');
            
            // Query corrigida: Removido o .order('created_at') para evitar o erro de coluna inexistente
            const { data: receitas, error } = await _supabase
                .from('receitas')
                .select(`
                    *,
                    ingredientes_receita (
                        quantidade,
                        materias_primas ( preco_atual )
                    )
                `);

            if (error) {
                container.innerHTML = `<div class="bg-red-50 text-red-500 p-6 rounded-[2rem] text-center font-bold text-xs uppercase border border-red-100">Erro: ${error.message}</div>`;
                return;
            }

            if (receitas.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-400 font-black text-[10px] uppercase tracking-widest">Nenhuma receita encontrada.</div>`;
                return;
            }

            container.innerHTML = receitas.map(r => {
                // Cálculo do custo total da receita
                const custoTotal = r.ingredientes_receita.reduce((acc, ing) => {
                    const preco = ing.materias_primas?.preco_atual || 0;
                    return acc + (preco * ing.quantidade);
                }, 0);

                return `
                <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-200 mb-4 flex items-center justify-between group active:scale-[0.98] transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-slate-50 rounded-[1.5rem] flex items-center justify-center text-slate-400 group-hover:bg-orange-50 group-hover:text-orange-500 transition-colors">
                            <i class="fa-solid fa-utensils text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-black text-slate-900 uppercase text-sm tracking-tight">${r.nome}</h3>
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1">Custo Matéria: <span class="text-orange-500">${custoTotal.toFixed(2)}€</span></p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-200"></i>
                </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', carregarReceitas);
    </script>
</body>
</html>
