<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Receitas - RestoCheck</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 pb-32 font-sans antialiased">

    <header class="p-6 bg-white border-b border-slate-100 sticky top-0 z-30">
        <h1 class="text-3xl font-black text-slate-900 tracking-tighter">Minhas Receitas</h1>
        <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest text-left">Fichas Técnicas Ativas</p>
    </header>

    <main id="lista-cards" class="p-6 space-y-4">
        <div class="text-center py-20 text-slate-400 font-bold animate-pulse uppercase text-[10px]">A calcular custos...</div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl z-50 text-slate-400">
        <a href="index.html"><i class="fa-solid fa-house"></i></a>
        <a href="mp.html"><i class="fa-solid fa-box-open"></i></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-50 flex items-center justify-center shadow-lg"><i class="fa-solid fa-qrcode text-white"></i></div></a>
        <a href="categorias.html"><i class="fa-solid fa-layer-group"></i></a>
        <a href="receitas.html" class="text-orange-400"><i class="fa-solid fa-utensils"></i></a>
    </nav>

    <script>
        async function carregarReceitas() {
            const container = document.getElementById('lista-cards');
            
            try {
                // Puxamos a receita + ingredientes + preço da matéria prima tudo de uma vez
                const { data: receitas, error } = await _supabase
                    .from('receitas')
                    .select(`
                        *,
                        ingredientes_receita (
                            quantidade,
                            materias_primas ( nome, preco_atual, unidade )
                        )
                    `);

                if (error) throw error;

                container.innerHTML = '';

                receitas.forEach(receita => {
                    let custoTotal = 0;

                    // Cálculo do custo da ficha técnica
                    receita.ingredientes_receita.forEach(ing => {
                        const precoUnitario = ing.materias_primas?.preco_atual || 0;
                        custoTotal += precoUnitario * ing.quantidade;
                    });

                    const margem = receita.preco_venda > 0 
                        ? (((receita.preco_venda - custoTotal) / receita.preco_venda) * 100).toFixed(0) 
                        : 0;

                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 relative overflow-hidden">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h2 class="font-black text-lg tracking-tighter uppercase text-slate-800">${receita.nome}</h2>
                                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter italic">Criada em: ${new Date(receita.created_at).toLocaleDateString()}</p>
                                </div>
                                <span class="${margem > 70 ? 'bg-green-50 text-green-600' : 'bg-orange-50 text-orange-600'} px-3 py-1 rounded-full text-[10px] font-black uppercase">
                                    ${margem}% Margem
                                </span>
                            </div>

                            <div class="grid grid-cols-2 gap-4 border-t border-slate-50 pt-4">
                                <div>
                                    <p class="text-[8px] font-black text-slate-400 uppercase mb-1 tracking-widest text-left">Custo Matéria Prima</p>
                                    <p class="font-bold text-slate-700 text-base text-left">${custoTotal.toFixed(2)}€</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[8px] font-black text-slate-400 uppercase mb-1 tracking-widest">Preço Sugerido</p>
                                    <p class="font-black text-slate-900 text-base underline decoration-orange-500 decoration-2 underline-offset-4">${receita.preco_venda.toFixed(2)}€</p>
                                </div>
                            </div>

                            <div class="flex gap-2 mt-4 pt-4 border-t border-slate-50">
                                <button onclick="apagarReceita(${receita.id})" class="text-[10px] font-black text-red-400 uppercase p-2">Apagar</button>
                                <button onclick="alert('Funcionalidade de edição em breve!')" class="text-[10px] font-black text-slate-400 uppercase p-2 ml-auto text-right">Ver Detalhes</button>
                            </div>
                        </div>`;
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="bg-red-50 p-6 rounded-3xl text-red-500 font-bold text-xs">Erro ao carregar dados. Verifica as Foreign Keys!</div>`;
            }
        }

        async function apagarReceita(id) {
            if(!confirm("Queres mesmo apagar esta receita?")) return;
            
            // 1. Apaga ingredientes primeiro (por causa da restrição de FK)
            await _supabase.from('ingredientes_receita').delete().eq('receita_id', id);
            // 2. Apaga a receita
            await _supabase.from('receitas').delete().eq('id', id);
            
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', carregarReceitas);
    </script>
</body>
</html>
