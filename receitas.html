<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Receita - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 pb-40 font-sans antialiased text-slate-900">

    <header class="p-6 bg-white border-b border-slate-200 sticky top-0 z-40 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4">
            <a href="lista_receitas.html" class="w-10 h-10 bg-slate-900 text-white rounded-full flex items-center justify-center active:scale-90 transition-transform">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-xl font-black tracking-tighter uppercase leading-none">Editar Receita</h1>
                <p class="text-[9px] font-black uppercase text-slate-400 tracking-widest mt-1">Ficha Técnica</p>
            </div>
        </div>
    </header>

    <main class="p-4 space-y-8 max-w-2xl mx-auto">
        
        <section class="space-y-4">
            <p class="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em] ml-2">Dados Principais</p>
            <div class="space-y-3">
                <input type="text" id="nome-receita" placeholder="Nome da Receita" 
                    class="w-full p-5 bg-white border border-slate-200 rounded-[1.5rem] font-bold text-slate-700 shadow-sm focus:ring-2 focus:ring-orange-500 outline-none transition-all placeholder:text-slate-300">
                
                <input type="number" id="porcoes" placeholder="Nº de Porções / Rendimento" 
                    class="w-full p-5 bg-white border border-slate-200 rounded-[1.5rem] font-bold text-slate-700 shadow-sm focus:ring-2 focus:ring-orange-500 outline-none transition-all placeholder:text-slate-300">
            </div>
        </section>

        <section class="space-y-4">
            <p class="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em] ml-2">Adicionar Ingredientes</p>
            <div class="flex gap-2">
                <select id="select-ingrediente" 
                    class="flex-1 p-5 bg-white border border-slate-200 rounded-[1.5rem] font-bold text-slate-700 shadow-sm focus:ring-2 focus:ring-orange-500 outline-none appearance-none cursor-pointer">
                    <option value="" disabled selected>Escolher Ingrediente...</option>
                    </select>
                
                <input type="number" id="qtd-ingrediente" placeholder="Qtd" 
                    class="w-24 p-5 bg-white border border-slate-200 rounded-[1.5rem] font-bold text-center text-slate-700 shadow-sm focus:ring-2 focus:ring-orange-500 outline-none transition-all">
                
                <button onclick="adicionarIngredienteNaLista()" 
                    class="w-16 bg-orange-500 text-white rounded-[1.5rem] flex items-center justify-center shadow-lg shadow-orange-200 active:scale-90 transition-all">
                    <i class="fa-solid fa-plus text-xl"></i>
                </button>
            </div>
        </section>

        <div id="lista-ingredientes" class="space-y-3">
            </div>

        <button id="btn-salvar" onclick="salvarFichaTecnica()" 
            class="w-full bg-slate-900 text-white p-6 rounded-[2rem] font-black uppercase tracking-[0.2em] shadow-xl active:scale-[0.98] transition-all flex items-center justify-center gap-3">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            Atualizar Ficha Técnica
        </button>

    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl z-50 border border-white/5">
        <a href="index.html" class="p-4 text-slate-400"><i class="fa-solid fa-house"></i></a>
        <a href="mp.html" class="p-4 text-slate-400"><i class="fa-solid fa-box-open"></i></a>
        <a href="scan.html" class="relative -mt-14">
            <div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-50 flex items-center justify-center shadow-lg text-white">
                <i class="fa-solid fa-qrcode"></i>
            </div>
        </a>
        <a href="categorias.html" class="p-4 text-slate-400"><i class="fa-solid fa-layer-group"></i></a>
        <a href="lista_receitas.html" class="p-4 text-orange-400"><i class="fa-solid fa-utensils"></i></a>
    </nav>

    <script>
        let ingredientesAdicionados = [];

        async function carregarMateriasPrimas() {
            const { data } = await _supabase.from('materias_primas').select('*').order('nome');
            const select = document.getElementById('select-ingrediente');
            data.forEach(mp => {
                select.innerHTML += `<option value="${mp.id}">${mp.nome} (kg)</option>`;
            });
        }

        function adicionarIngredienteNaLista() {
            const select = document.getElementById('select-ingrediente');
            const qtdInput = document.getElementById('qtd-ingrediente');
            
            if (!select.value || !qtdInput.value) {
                alert("Preenche o ingrediente e a quantidade!");
                return;
            }

            const item = {
                id: select.value,
                nome: select.options[select.selectedIndex].text,
                quantidade: qtdInput.value
            };

            ingredientesAdicionados.push(item);
            renderizarLista();

            // LIMPEZA DOS CAMPOS APÓS ESCOLHA
            select.value = ""; 
            qtdInput.value = "";
            select.focus();
        }

        function renderizarLista() {
            const container = document.getElementById('lista-ingredientes');
            container.innerHTML = ingredientesAdicionados.map((ing, index) => `
                <div class="bg-white p-5 rounded-[1.5rem] border border-slate-200 flex justify-between items-center shadow-sm animate-in fade-in slide-in-from-right-4">
                    <div>
                        <p class="font-black text-slate-800 text-xs uppercase">${ing.nome}</p>
                        <p class="text-[9px] font-black text-orange-500 uppercase tracking-widest">${ing.quantidade} UNIDADES/KG</p>
                    </div>
                    <button onclick="removerIngrediente(${index})" class="w-10 h-10 bg-slate-50 text-slate-300 rounded-xl hover:text-red-500 transition-colors">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>
            `).join('');
        }

        function removerIngrediente(index) {
            ingredientesAdicionados.splice(index, 1);
            renderizarLista();
        }

        document.addEventListener('DOMContentLoaded', carregarMateriasPrimas);
    </script>
</body>
</html>
