<main class="p-6 space-y-6">
    <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
        <h2 class="text-xl font-black tracking-tighter mb-6 uppercase">Nova Receita</h2>
        
        <div class="space-y-4">
            <input type="text" id="nome-receita" placeholder="Nome da Receita (Ex: Bife)" class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-orange-500 font-bold">
            <input type="number" id="preco-venda" placeholder="Preço de Venda (€)" class="w-full p-4 bg-slate-50 rounded-2xl border-none focus:ring-2 focus:ring-orange-500 font-bold">
            
            <hr class="my-6 border-slate-50">
            <p class="text-[10px] font-black uppercase text-slate-400 italic">Adicionar Ingrediente</p>
            
            <div class="flex gap-2">
                <select id="select-mp" class="flex-1 p-4 bg-slate-50 rounded-2xl border-none font-bold text-sm">
                    </select>
                <input type="number" id="qtd-ingrediente" placeholder="Qtd" class="w-20 p-4 bg-slate-50 rounded-2xl border-none font-bold">
                <button onclick="adicionarIngredienteLista()" class="bg-slate-900 text-white w-12 h-12 rounded-xl flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>
            </div>

            <ul id="lista-temp-ingredientes" class="space-y-2 mt-4">
                </ul>

            <button onclick="salvarReceitaCompleta()" id="btn-lançar" class="w-full bg-orange-500 text-white p-5 rounded-[2rem] font-black uppercase tracking-widest shadow-lg shadow-orange-200 mt-8">
                Lançar Receita
            </button>
        </div>
    </div>
</main>

<script>
    let ingredientesParaSalvar = [];

    // 1. Carrega as Matérias-Primas para o Select
    async function loadMP() {
        const { data } = await _supabase.from('materias_primas').select('*');
        const select = document.getElementById('select-mp');
        select.innerHTML = data.map(mp => `<option value="${mp.id}">${mp.nome} (${mp.unidade})</option>`).join('');
    }

    // 2. Adiciona à lista visual antes de salvar no banco
    function adicionarIngredienteLista() {
        const select = document.getElementById('select-mp');
        const qtd = document.getElementById('qtd-ingrediente').value;
        const nomeMp = select.options[select.selectedIndex].text;

        if(!qtd) return alert("Coloca a quantidade!");

        ingredientesParaSalvar.push({ mp_id: select.value, quantidade: qtd, nome: nomeMp });
        
        document.getElementById('lista-temp-ingredientes').innerHTML += `
            <li class="flex justify-between bg-slate-50 p-3 rounded-xl text-xs font-bold text-slate-600">
                <span>${nomeMp}</span>
                <span>${qtd}</span>
            </li>`;
    }

    // 3. O "Cérebro" do botão: Salva a receita e depois os ingredientes
    async function salvarReceitaCompleta() {
        const btn = document.getElementById('btn-lançar');
        const nome = document.getElementById('nome-receita').value;
        const preco = document.getElementById('preco-venda').value;

        if(!nome || ingredientesParaSalvar.length === 0) return alert("Falta o nome ou ingredientes!");

        btn.innerText = "A GUARDAR...";
        btn.disabled = true;

        try {
            // A. Salva a Receita
            const { data: receitaCriada, error: errR } = await _supabase
                .from('receitas')
                .insert([{ nome: nome, preco_venda: preco }])
                .select();

            if (errR) throw errR;

            const receitaId = receitaCriada[0].id;

            // B. Salva os Ingredientes ligados a esse ID
            const rows = ingredientesParaSalvar.map(ing => ({
                receita_id: receitaId,
                mp_id: ing.mp_id,
                quantidade: ing.quantidade
            }));

            const { error: errI } = await _supabase.from('ingredientes_receita').insert(rows);
            if (errI) throw errI;

            alert("Receita lançada com sucesso!");
            window.location.reload();

        } catch (error) {
            console.error(error);
            alert("Erro ao salvar. Vê o console.");
            btn.innerText = "LANÇAR RECEITA";
            btn.disabled = false;
        }
    }

    document.addEventListener('DOMContentLoaded', loadMP);
</script>
