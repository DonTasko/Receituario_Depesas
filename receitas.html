<!DOCTYPE html>
<html lang="pt">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#F8FAFC] pb-40 font-sans">
    <header class="p-6">
        <h1 class="text-3xl font-black text-slate-900 tracking-tighter">Receitas</h1>
        <p class="text-slate-500 text-sm font-medium">Fichas Técnicas e Margens</p>
    </header>

    <main id="lista-receitas" class="px-6 grid grid-cols-1 gap-6">
        <p class="text-center text-slate-400 py-10 font-bold uppercase text-[10px]">A carregar menu...</p>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl border border-white/10 z-50">
        <a href="index.html" class="flex flex-col items-center"><i class="fa-solid fa-house text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Início</span></a>
        <a href="mp.html" class="flex flex-col items-center"><i class="fa-solid fa-box-open text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Stock</span></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-[#F8FAFC] flex items-center justify-center shadow-lg active:scale-90 transition-transform"><i class="fa-solid fa-qrcode text-white text-2xl"></i></div></a>
        <a href="categorias.html" class="flex flex-col items-center"><i class="fa-solid fa-layer-group text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Categorias</span></a>
        <a href="receitas.html" class="flex flex-col items-center"><i class="fa-solid fa-utensils text-orange-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-orange-400">Receitas</span></a>
    </nav>

    <script>
        async function carregarReceitas() {
            const container = document.getElementById('lista-receitas');
            
            const { data: receitas, error } = await _supabase
                .from('receitas')
                .select('*');

            if (error) {
                console.error(error);
                return;
            }

            container.innerHTML = '';

            receitas.forEach(prato => {
                // Cálculo de margem fictício para este exemplo (depois ligaremos aos ingredientes reais)
                const custoEstimado = prato.preco_venda * 0.3; 
                const margem = ((prato.preco_venda - custoEstimado) / prato.preco_venda * 100).toFixed(0);

                const card = `
                    <div class="bg-white rounded-[2.5rem] overflow-hidden shadow-sm border border-slate-100">
                        <div class="h-40 bg-slate-200 relative">
                            <img src="${prato.imagem_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'}" class="w-full h-full object-cover">
                            <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full">
                                <span class="text-[10px] font-black uppercase text-slate-800">${prato.categoria}</span>
                            </div>
                        </div>
                        <div class="p-6">
                            <div class="flex justify-between items-start mb-4">
                                <h3 class="font-black text-lg text-slate-800">${prato.nome}</h3>
                                <span class="bg-emerald-100 text-emerald-600 px-3 py-1 rounded-lg text-xs font-black">${margem}% Margem</span>
                            </div>
                            <div class="flex justify-between items-center border-t border-slate-50 pt-4">
                                <div>
                                    <p class="text-[9px] text-slate-400 font-black uppercase tracking-widest">Preço Venda</p>
                                    <p class="font-black text-slate-900">${formatarMoeda(prato.preco_venda)}</p>
                                </div>
                                <button class="bg-slate-900 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all">Detalhes</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        document.addEventListener('DOMContentLoaded', carregarReceitas);
    </script>
</body>
</html>
