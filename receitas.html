<!DOCTYPE html>
<html lang="pt">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RestoCheck - Receitas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#F8FAFC] pb-40 font-sans antialiased text-slate-900">

    <header class="p-6 bg-white border-b border-slate-100 mb-6">
        <h1 class="text-3xl font-black text-slate-900 tracking-tighter">Receitas</h1>
        <p class="text-slate-500 text-sm font-medium uppercase tracking-widest text-[10px]">Fichas Técnicas e Margens</p>
    </header>

    <main id="lista-receitas" class="px-6 grid grid-cols-1 gap-6">
        <div class="flex flex-col items-center justify-center py-20 text-slate-400">
            <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-4"></i>
            <p class="font-black uppercase text-[10px] tracking-widest">A carregar menu...</p>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl border border-white/10 z-50">
        <a href="index.html" class="flex flex-col items-center"><i class="fa-solid fa-house text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Início</span></a>
        <a href="mp.html" class="flex flex-col items-center"><i class="fa-solid fa-box-open text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Stock</span></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-[#F8FAFC] flex items-center justify-center shadow-lg active:scale-90 transition-transform"><i class="fa-solid fa-qrcode text-white text-2xl"></i></div></a>
        <a href="categorias.html" class="flex flex-col items-center"><i class="fa-solid fa-layer-group text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Categorias</span></a>
        <a href="receitas.html" class="flex flex-col items-center"><i class="fa-solid fa-utensils text-orange-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-orange-400">Receitas</span></a>
    </nav>

    <script>
        async function carregarReceitas() {
            const container = document.getElementById('lista-receitas');
            
            try {
                // Busca as receitas e os ingredientes associados
                const { data: receitas, error } = await _supabase
                    .from('receitas')
                    .select(`
                        *,
                        ingredientes_receita (
                            quantidade,
                            materias_primas (preco_atual)
                        )
                    `);

                if (error) throw error;

                // Se não houver dados
                if (!receitas || receitas.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-10">
                            <p class="text-slate-400 font-bold uppercase text-[10px]">Nenhuma receita encontrada.</p>
                        </div>`;
                    return;
                }

                container.innerHTML = ''; // Limpa o carregamento

                receitas.forEach(prato => {
                    // Cálculo do Custo Real
                    let custoTotal = 0;
                    if (prato.ingredientes_receita) {
                        prato.ingredientes_receita.forEach(ing => {
                            const precoUnitario = ing.materias_primas?.preco_atual || 0;
                            custoTotal += precoUnitario * (ing.quantidade || 0);
                        });
                    }

                    // Cálculo da Margem
                    const margem = prato.preco_venda > 0 
                        ? (((prato.preco_venda - custoTotal) / prato.preco_venda) * 100).toFixed(0) 
                        : 0;

                    const corMargem = margem < 70 ? 'text-red-500 bg-red-50' : 'text-emerald-600 bg-emerald-100';

                    const card = `
                        <div class="bg-white rounded-[2.5rem] overflow-hidden shadow-sm border border-slate-100 animate-fade-in">
                            <div class="h-40 bg-slate-200 relative">
                                <img src="${prato.imagem_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'}" 
                                     class="w-full h-full object-cover" 
                                     onerror="this.src='https://via.placeholder.com/400x200?text=Sem+Imagem'">
                                <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full">
                                    <span class="text-[10px] font-black uppercase text-slate-800">${prato.categoria || 'Geral'}</span>
                                </div>
                            </div>
                            <div class="p-6">
                                <div class="flex justify-between items-start mb-4">
                                    <h3 class="font-black text-lg text-slate-800 leading-tight">${prato.nome}</h3>
                                    <span class="${corMargem} px-3 py-1 rounded-lg text-xs font-black">${margem}% Margem</span>
                                </div>
                                <div class="grid grid-cols-2 gap-4 border-t border-slate-50 pt-4">
                                    <div>
                                        <p class="text-[9px] text-slate-400 font-black uppercase tracking-widest leading-none mb-1">Custo Matéria</p>
                                        <p class="font-bold text-slate-700">${formatarMoeda(custoTotal)}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[9px] text-slate-400 font-black uppercase tracking-widest leading-none mb-1">PVP Sugerido</p>
                                        <p class="font-black text-orange-500">${formatarMoeda(prato.preco_venda)}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (err) {
                console.error("Erro Geral:", err);
                container.innerHTML = `<p class="text-red-500 text-center font-bold">Erro ao ligar à base de dados.</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', carregarReceitas);
    </script>

    <style>
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</body>
</html>
