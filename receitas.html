<!DOCTYPE html>
<html lang="pt">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receitas - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 pb-40 font-sans antialiased text-slate-900">

    <header class="p-6 bg-white border-b border-slate-100 sticky top-0 z-30">
        <h1 class="text-3xl font-black text-slate-900 tracking-tighter text-left">Receitas</h1>
        <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest text-left">Fichas Técnicas e Margens</p>
    </header>

    <main id="lista-receitas" class="p-6 space-y-4">
        <p class="text-center py-20 text-slate-400 font-bold uppercase text-[10px]">A carregar dados...</p>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl z-50 text-slate-400">
        <a href="index.html"><i class="fa-solid fa-house"></i></a>
        <a href="mp.html"><i class="fa-solid fa-box-open"></i></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-50 flex items-center justify-center shadow-lg"><i class="fa-solid fa-qrcode text-white"></i></div></a>
        <a href="categorias.html"><i class="fa-solid fa-layer-group"></i></a>
        <a href="receitas.html" class="text-orange-400"><i class="fa-solid fa-utensils"></i></a>
    </nav>

    <script>
        async function carregarReceitas() {
            const container = document.getElementById('lista-receitas');
            try {
                const { data, error } = await _supabase
                    .from('receitas')
                    .select(`
                        *,
                        ingredientes_receita (
                            quantidade,
                            materias_primas ( nome, preco_atual, unidade )
                        )
                    `);

                if (error) throw error;
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-center py-20 text-slate-400 font-bold uppercase text-[10px]">Sem receitas registadas.</p>';
                    return;
                }

                container.innerHTML = '';
                data.forEach(receita => {
                    let custoTotal = 0;
                    receita.ingredientes_receita?.forEach(ing => {
                        const preco = ing.materias_primas?.preco_atual || 0;
                        custoTotal += preco * ing.quantidade;
                    });

                    const margem = receita.preco_venda > 0 ? ((receita.preco_venda - custoTotal) / receita.preco_venda * 100).toFixed(0) : 0;

                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
                            <div class="flex justify-between items-start mb-4 text-left">
                                <h2 class="font-black text-lg tracking-tighter uppercase text-slate-800">${receita.nome}</h2>
                                <span class="bg-orange-50 text-orange-600 px-3 py-1 rounded-full text-[9px] font-black uppercase">${margem}% Margem</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 border-t border-slate-50 pt-4 text-left">
                                <div>
                                    <p class="text-[8px] font-black text-slate-400 uppercase mb-1">Custo Produção</p>
                                    <p class="font-bold text-slate-700 text-sm">${custoTotal.toFixed(2)}€</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[8px] font-black text-slate-400 uppercase mb-1">Preço Venda</p>
                                    <p class="font-black text-slate-900 text-sm">${receita.preco_venda.toFixed(2)}€</p>
                                </div>
                            </div>
                        </div>`;
                });
            } catch (err) {
                container.innerHTML = `<div class="bg-red-50 p-6 rounded-[2rem] text-center border border-red-100"><p class="text-red-500 font-black uppercase text-[10px]">Erro nas Foreign Keys</p></div>`;
            }
        }
        document.addEventListener('DOMContentLoaded', carregarReceitas);
    </script>
</body>
</html>
