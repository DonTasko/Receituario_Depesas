<!DOCTYPE html>
<html lang="pt">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Fatura - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#F8FAFC] pb-40 font-sans">
    <header class="p-6 bg-white shadow-sm sticky top-0 z-30 rounded-b-[2.5rem] flex justify-between items-center">
        <h2 class="font-black text-slate-900 uppercase tracking-widest text-xs">Validar Fatura</h2>
        <a href="index.html" class="text-orange-500 font-bold text-xs uppercase">Concluir</a>
    </header>

    <main class="p-6 space-y-4">
        <div class="flex items-center gap-4 p-4 bg-slate-900 rounded-[2rem] text-white">
            <i class="fa-solid fa-truck-fast text-orange-400 text-xl"></i>
            <div>
                <p class="text-[10px] text-slate-400 font-black uppercase">Fatura de:</p>
                <h3 class="font-bold text-sm">Talho do Mercado Lda.</h3>
            </div>
        </div>

        <div class="bg-white p-5 rounded-[2rem] border border-emerald-100">
            <p class="text-[10px] text-slate-400 font-bold uppercase mb-2 italic">Correspondência 100%</p>
            <div class="flex justify-between items-center">
                <h4 class="font-black text-slate-800">Picanha (12kg)</h4>
                <p class="font-black text-slate-900">306.00€</p>
            </div>
        </div>

        <div class="bg-orange-50 p-5 rounded-[2rem] border border-orange-200">
            <p class="text-[10px] text-orange-600 font-black uppercase mb-2 italic">Artigo Novo Detetado</p>
            <div class="flex justify-between items-center mb-4">
                <h4 class="font-black text-slate-800">Chouriço Caseiro</h4>
                <p class="font-black text-slate-900">14.50€</p>
            </div>
            <button class="w-full bg-white py-2 rounded-xl text-[10px] font-black uppercase border border-orange-200 text-orange-600">Associar ao Stock</button>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl border border-white/10 z-50">
        <a href="index.html" class="flex flex-col items-center"><i class="fa-solid fa-house text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Início</span></a>
        <a href="mp.html" class="flex flex-col items-center"><i class="fa-solid fa-box-open text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Stock</span></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-[#F8FAFC] flex items-center justify-center shadow-lg active:scale-90 transition-transform"><i class="fa-solid fa-qrcode text-white text-2xl"></i></div></a>
        <a href="categorias.html" class="flex flex-col items-center"><i class="fa-solid fa-layer-group text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Categorias</span></a>
        <a href="receitas.html" class="flex flex-col items-center"><i class="fa-solid fa-utensils text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Receitas</span></a>
    </nav>
</body>
</html>
