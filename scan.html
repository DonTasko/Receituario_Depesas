<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner IA - RestoCheck</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 pb-32 font-sans antialiased text-slate-900">

    <header class="p-6 bg-white border-b border-slate-200 sticky top-0 z-30 flex justify-between items-center">
        <a href="index.html" class="text-slate-400 p-2"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <h1 class="text-xl font-black tracking-tighter uppercase">Scanner de Faturas</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-6 space-y-6">
        <div id="drop-zone" class="bg-white p-8 rounded-[3rem] border-4 border-dashed border-slate-200 flex flex-col items-center justify-center text-center space-y-4 transition-all" onclick="document.getElementById('file-input').click()">
            <div id="icon-container" class="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center text-orange-500">
                <i class="fa-solid fa-cloud-arrow-up text-3xl"></i>
            </div>
            <div id="text-container">
                <p class="font-black uppercase tracking-widest text-xs text-slate-400">Tirar Foto ou Carregar Ficheiro</p>
                <p class="text-[10px] text-slate-300 font-bold mt-1">Imagens ou PDFs de faturas</p>
            </div>
            <img id="preview" class="hidden w-full rounded-2xl shadow-lg border border-slate-100">
            <input type="file" id="file-input" accept="image/*,application/pdf" class="hidden" onchange="iniciarLeitura(this)">
        </div>

        <div id="status-ocr" class="hidden bg-slate-900 text-white p-6 rounded-[2rem] shadow-xl animate-pulse">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-brain text-orange-400 text-2xl"></i>
                <div>
                    <p class="text-[10px] font-black uppercase tracking-widest text-orange-400">IA a processar...</p>
                    <p id="progresso-texto" class="font-bold text-sm">A ler texto da fatura...</p>
                </div>
            </div>
        </div>

        <div id="resultados" class="hidden space-y-4">
            <p class="text-[10px] font-black uppercase text-slate-400 ml-4">Produtos detetados na fatura:</p>
            <div id="lista-detecoes" class="space-y-2">
                </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl z-50 text-slate-400">
        <a href="index.html" class="p-4"><i class="fa-solid fa-house"></i></a>
        <a href="mp.html" class="p-4"><i class="fa-solid fa-box-open"></i></a>
        <a href="scan.html" class="relative -mt-14">
            <div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-100 flex items-center justify-center shadow-lg text-white text-xl">
                <i class="fa-solid fa-qrcode"></i>
            </div>
        </a>
        <a href="categorias.html" class="p-4"><i class="fa-solid fa-layer-group"></i></a>
        <a href="lista_receitas.html" class="p-4"><i class="fa-solid fa-utensils"></i></a>
    </nav>

    <script>
        async function iniciarLeitura(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];

            // 1. Mostrar Preview e Status
            document.getElementById('icon-container').classList.add('hidden');
            document.getElementById('text-container').classList.add('hidden');
            const preview = document.getElementById('preview');
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden');
            
            document.getElementById('status-ocr').classList.remove('hidden');
            document.getElementById('resultados').classList.add('hidden');

            try {
                // 2. Executar OCR com Tesseract
                const worker = Tesseract.createWorker({
                    logger: m => {
                        if(m.status === 'recognizing text') {
                            document.getElementById('progresso-texto').innerText = `A ler: ${(m.progress * 100).toFixed(0)}%`;
                        }
                    }
                });

                await worker.load();
                await worker.loadLanguage('por');
                await worker.initialize('por');
                const { data: { text } } = await worker.recognize(file);
                await worker.terminate();

                processarTextoDeteção(text.toLowerCase());

            } catch (err) {
                console.error(err);
                alert("Erro ao ler fatura. Tenta uma foto mais nítida.");
            } finally {
                document.getElementById('status-ocr').classList.add('hidden');
            }
        }

        async function processarTextoDeteção(textoFatura) {
            // 3. Buscar as tuas Matérias Primas para comparar
            const { data: produtos } = await _supabase.from('materias_primas').select('*');
            const listaDeteccoes = document.getElementById('lista-detecoes');
            listaDeteccoes.innerHTML = '';
            let encontrouAlgo = false;

            produtos.forEach(prod => {
                // Verifica se o nome do produto aparece no texto da fatura
                if (textoFatura.includes(prod.nome.toLowerCase())) {
                    encontrouAlgo = true;
                    // Tenta encontrar um número (preço) perto do nome (lógica simplificada)
                    const regexPreco = new RegExp(prod.nome.toLowerCase() + "[^0-9]*([0-9]+[.,][0-9]{2})", "i");
                    const match = textoFatura.match(regexPreco);
                    const precoSugerido = match ? match[1].replace(',', '.') : prod.preco_atual;

                    listaDeteccoes.innerHTML += `
                        <div class="bg-white p-5 rounded-3xl border border-slate-200 flex justify-between items-center shadow-sm">
                            <div>
                                <p class="font-black text-slate-800 uppercase text-xs tracking-tighter">${prod.nome}</p>
                                <p class="text-[10px] text-slate-400 font-bold">Preço em Stock: ${prod.preco_atual}€</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[8px] font-black text-orange-500 mb-1 uppercase">Detetado</p>
                                <input type="number" step="0.01" value="${precoSugerido}" id="input-preco-${prod.id}" 
                                    class="w-20 p-2 bg-slate-50 border border-slate-200 rounded-lg text-right font-black text-sm outline-none focus:border-orange-500">
                                <button onclick="atualizarPreco(${prod.id})" class="ml-2 bg-slate-900 text-white p-2 rounded-lg"><i class="fa-solid fa-check"></i></button>
                            </div>
                        </div>`;
                }
            });

            if (!encontrouAlgo) {
                listaDeteccoes.innerHTML = `<p class="p-6 text-center text-slate-400 font-bold text-xs uppercase">Não detetei produtos conhecidos nesta fatura.</p>`;
            }
            document.getElementById('resultados').classList.remove('hidden');
        }

        async function atualizarPreco(id) {
            const novoPreco = document.getElementById(`input-preco-${id}`).value;
            const { error } = await _supabase
                .from('materias_primas')
                .update({ preco_atual: parseFloat(novoPreco) })
                .eq('id', id);

            if (!error) {
                alert("Preço atualizado no stock!");
            } else {
                alert("Erro ao atualizar.");
            }
        }
    </script>
</body>
</html>
