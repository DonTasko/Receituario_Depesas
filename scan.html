<!DOCTYPE html>
<html lang="pt">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.min.js'></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 pb-40 font-sans antialiased text-white">

    <header class="p-6">
        <h1 class="text-3xl font-black tracking-tighter">Scanner</h1>
        <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest">Leitor de Faturas</p>
    </header>

    <main class="px-6 space-y-6">
        <div id="camera-container" class="relative aspect-[3/4] bg-slate-800 rounded-[2.5rem] border-2 border-dashed border-slate-700 overflow-hidden flex items-center justify-center">
            <video id="video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <div id="placeholder" class="text-center p-10">
                <i class="fa-solid fa-file-invoice text-5xl text-slate-600 mb-4 shadow-glow"></i>
                <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest">Alinha a fatura aqui</p>
            </div>
            <div id="loading-overlay" class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur flex flex-col items-center justify-center z-10">
                <div class="w-12 h-12 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-[10px] font-black uppercase tracking-widest">A ler dados...</p>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <button onclick="iniciarCamera()" id="btn-foto" class="bg-orange-500 py-5 rounded-3xl font-black uppercase tracking-widest text-xs shadow-lg active:scale-95 transition-all">
                <i class="fa-solid fa-camera mr-2"></i> Abrir Câmara
            </button>
            <button onclick="tirarFoto()" id="btn-capture" class="hidden bg-white text-slate-900 py-5 rounded-3xl font-black uppercase tracking-widest text-xs shadow-lg active:scale-95 transition-all">
                Capturar Agora
            </button>
        </div>

        <div id="resultado-scan" class="hidden bg-white rounded-[2.5rem] p-6 text-slate-900">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-black text-xs uppercase tracking-tighter">Texto Extraído</h2>
                <button onclick="location.reload()" class="text-slate-400 text-[10px] font-bold underline">Limpar</button>
            </div>
            <div id="lista-detetada" class="space-y-3 max-h-60 overflow-y-auto font-mono text-[10px] bg-slate-50 p-4 rounded-2xl">
                </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-800/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl border border-white/5 z-50 text-slate-400">
        <a href="index.html" class="flex flex-col items-center"><i class="fa-solid fa-house text-lg mb-1"></i></a>
        <a href="mp.html" class="flex flex-col items-center"><i class="fa-solid fa-box-open text-lg mb-1"></i></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-900 flex items-center justify-center shadow-lg"><i class="fa-solid fa-qrcode text-white text-2xl"></i></div></a>
        <a href="categorias.html" class="flex flex-col items-center"><i class="fa-solid fa-layer-group text-lg mb-1"></i></a>
        <a href="receitas.html" class="flex flex-col items-center"><i class="fa-solid fa-utensils text-lg mb-1"></i></a>
    </nav>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading-overlay');

        async function iniciarCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                video.classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
                document.getElementById('btn-foto').classList.add('hidden');
                document.getElementById('btn-capture').classList.remove('hidden');
            } catch (err) { alert("Acesso à câmara negado."); }
        }

        async function tirarFoto() {
            loading.classList.remove('hidden');
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Parar câmara
            video.srcObject.getTracks().forEach(track => track.stop());
            video.classList.add('hidden');
            document.getElementById('btn-capture').classList.add('hidden');

            // 1. PROCESSAR COM TESSERACT OCR
            const image = canvas.toDataURL('image/png');
            const result = await Tesseract.recognize(image, 'por', { logger: m => console.log(m) });
            
            exibirResultado(result.data.text);
        }

        function exibirResultado(texto) {
            loading.classList.add('hidden');
            document.getElementById('resultado-scan').classList.remove('hidden');
            const lista = document.getElementById('lista-detetada');
            
            // Limpa e mostra o texto bruto
            lista.innerText = texto;

            // DICA: O próximo passo será criar uma lógica que procura palavras-chave 
            // no texto (ex: "Picanha") e valores (ex: "25,00") para atualizar o Supabase.
            alert("Leitura concluída! Verifica o texto extraído.");
        }
    </script>
</body>
</html>
