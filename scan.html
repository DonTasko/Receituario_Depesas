<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner IA - RestoCheck</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@2.1.4/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 pb-32 font-sans antialiased text-slate-900">

    <header class="p-6 bg-white border-b border-slate-200 sticky top-0 z-30 flex justify-between items-center">
        <a href="index.html" class="text-slate-400 p-2 hover:bg-slate-50 rounded-full transition-colors">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </a>
        <h1 class="text-xl font-black tracking-tighter uppercase">Scanner de Faturas</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-6 space-y-6">
        <div id="drop-zone" class="bg-white p-8 rounded-[3rem] border-4 border-dashed border-slate-200 flex flex-col items-center justify-center text-center space-y-4 cursor-pointer hover:border-orange-300 transition-all shadow-sm" onclick="document.getElementById('file-input').click()">
            <div id="icon-container" class="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center text-orange-500 shadow-inner">
                <i class="fa-solid fa-camera-retro text-3xl"></i>
            </div>
            <div id="text-container">
                <p class="font-black uppercase tracking-widest text-xs text-slate-500">Digitalizar Documento</p>
                <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase">Imagens JPG/PNG</p>
            </div>
            <img id="preview" class="hidden w-full rounded-[2rem] shadow-2xl border-4 border-white">
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="iniciarLeitura(this)">
        </div>

        <div id="status-ocr" class="hidden bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-2xl border-t border-white/10 overflow-hidden relative">
            <div class="flex items-center gap-4 relative z-10">
                <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center animate-bounce">
                    <i class="fa-solid fa-brain text-white"></i>
                </div>
                <div class="flex-1">
                    <p class="text-[10px] font-black uppercase tracking-[0.2em] text-orange-400">Processamento IA</p>
                    <p id="progresso-texto" class="font-bold text-sm">A preparar motor de leitura...</p>
                    <div class="w-full h-1.5 bg-white/10 rounded-full mt-2 overflow-hidden">
                        <div id="progresso-barra" class="h-full bg-orange-500 w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="resultados" class="hidden space-y-4">
            <div class="flex justify-between items-center px-4">
                <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest">Produtos Reconhecidos</p>
                <span class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded text-[8px] font-bold uppercase">OCR Ativo</span>
            </div>
            <div id="lista-detecoes" class="space-y-3">
                </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl z-50 text-slate-400 border border-white/5">
        <a href="index.html" class="p-4"><i class="fa-solid fa-house"></i></a>
        <a href="mp.html" class="p-4"><i class="fa-solid fa-box-open"></i></a>
        <a href="scan.html" class="relative -mt-14">
            <div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-100 flex items-center justify-center shadow-lg text-white">
                <i class="fa-solid fa-qrcode text-xl"></i>
            </div>
        </a>
        <a href="categorias.html" class="p-4"><i class="fa-solid fa-layer-group"></i></a>
        <a href="lista_receitas.html" class="p-4"><i class="fa-solid fa-utensils"></i></a>
    </nav>

    <script>
        async function iniciarLeitura(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];

            // Reset visual
            document.getElementById('icon-container').classList.add('hidden');
            document.getElementById('text-container').classList.add('hidden');
            const preview = document.getElementById('preview');
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden');
            
            const statusDiv = document.getElementById('status-ocr');
            const progressoTexto = document.getElementById('progresso-texto');
            const progressoBarra = document.getElementById('progresso-barra');
            
            statusDiv.classList.remove('hidden');
            document.getElementById('resultados').classList.add('hidden');

            try {
                progressoTexto.innerText = "A carregar dicionário de dados...";
                
                // Execução do OCR
                const result = await Tesseract.recognize(
                    file,
                    'por',
                    { 
                        logger: m => {
                            if(m.status === 'recognizing text') {
                                const p = (m.progress * 100).toFixed(0);
                                progressoTexto.innerText = `A ler fatura: ${p}%`;
                                progressoBarra.style.width = `${p}%`;
                            }
                        }
                    }
                );

                console.log("Texto extraído com sucesso.");
                processarTextoDeteção(result.data.text.toLowerCase());

            } catch (err) {
                console.error("Erro OCR:", err);
                alert("Erro ao processar imagem. Verifica a ligação à internet.");
            } finally {
                statusDiv.classList.add('hidden');
            }
        }

        async function processarTextoDeteção(textoFatura) {
            const { data: produtos } = await _supabase.from('materias_primas').select('*');
            const listaDetecoes = document.getElementById('lista-detecoes');
            listaDetecoes.innerHTML = '';
            let contador = 0;

            produtos.forEach(prod => {
                // Procura o nome exato do produto no meio do texto da fatura
                if (textoFatura.includes(prod.nome.toLowerCase())) {
                    contador++;
                    
                    // Lógica para tentar encontrar o preço (número perto do nome)
                    const regex = new RegExp(prod.nome.toLowerCase() + "[^0-9]{0,25}([0-9]+[.,][0-9]{2})", "i");
                    const match = textoFatura.match(regex);
                    const valorFatura = match ? match[1].replace(',', '.') : prod.preco_atual;

                    listaDetecoes.innerHTML += `
                        <div class="bg-white p-5 rounded-[2rem] border border-slate-200 flex justify-between items-center shadow-sm animate-in fade-in slide-in-from-bottom-3">
                            <div class="flex-1">
                                <p class="font-black text-slate-800 uppercase text-[11px] leading-tight">${prod.nome}</p>
                                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest mt-1">Atual: ${prod.preco_atual}€</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="text-right">
                                    <p class="text-[8px] font-black text-orange-500 uppercase mb-1">Novo Preço</p>
                                    <input type="number" step="0.01" value="${valorFatura}" id="p-${prod.id}" 
                                        class="w-20 p-2 bg-slate-50 border border-slate-200 rounded-xl text-right font-black text-sm outline-none focus:ring-2 focus:ring-orange-500">
                                </div>
                                <button onclick="atualizarBD(${prod.id})" class="bg-slate-900 text-white w-12 h-12 rounded-2xl flex items-center justify-center active:scale-90 transition-all shadow-lg">
                                    <i class="fa-solid fa-check text-lg"></i>
                                </button>
                            </div>
                        </div>`;
                }
            });

            if (contador === 0) {
                listaDetecoes.innerHTML = `
                    <div class="bg-white p-10 rounded-[2.5rem] border border-slate-200 text-center">
                        <i class="fa-solid fa-magnifying-glass text-slate-200 text-4xl mb-4"></i>
                        <p class="text-slate-400 font-black text-[10px] uppercase tracking-widest leading-relaxed">Não foram encontrados produtos<br>conhecidos nesta fatura.</p>
                    </div>`;
            }
            document.getElementById('resultados').classList.remove('hidden');
        }

        async function atualizarBD(id) {
            const input = document.getElementById(`p-${id}`);
            const novoValor = parseFloat(input.value);

            const { error } = await _supabase
                .from('materias_primas')
                .update({ preco_atual: novoValor })
                .eq('id', id);

            if (!error) {
                input.parentElement.parentElement.classList.add('opacity-40');
                input.disabled = true;
                // Feedback visual de sucesso
                const btn = input.parentElement.nextElementSibling;
                btn.classList.replace('bg-slate-900', 'bg-green-500');
                btn.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else {
                alert("Erro ao atualizar preço.");
            }
        }
    </script>
</body>
</html>
