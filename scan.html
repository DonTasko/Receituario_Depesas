<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner IA - RestoCheck</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@2.1.4/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 pb-40 font-sans antialiased text-slate-900">

    <header class="p-6 bg-white border-b border-slate-200 sticky top-0 z-40 flex justify-between items-center shadow-sm">
        <a href="index.html" class="text-slate-400 p-2"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <h1 class="text-lg font-black tracking-tighter uppercase">Scanner Inteligente</h1>
        <div class="w-10"></div>
    </header>

    <main class="p-4 space-y-6">
        
        <div id="status-ocr" class="hidden bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-xl animate-pulse">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-brain text-white animate-bounce"></i>
                </div>
                <div class="flex-1">
                    <p class="text-[10px] font-black uppercase tracking-widest text-orange-400">Inteligência Artificial</p>
                    <p id="progresso-texto" class="font-bold text-sm">A analisar fatura...</p>
                </div>
            </div>
        </div>

        <div id="resultados" class="hidden space-y-4">
            <div class="flex items-center justify-between px-2">
                <h2 class="text-[11px] font-black uppercase text-slate-500 tracking-widest italic">Produtos Identificados</h2>
                <span class="bg-orange-500 text-white text-[9px] font-black px-2 py-1 rounded-lg">LIVE</span>
            </div>
            <div id="lista-detecoes" class="grid gap-3">
                </div>
        </div>

        <div id="drop-zone" class="bg-white p-8 rounded-[2.5rem] border-4 border-dashed border-slate-200 flex flex-col items-center justify-center text-center cursor-pointer hover:border-orange-400 transition-all shadow-sm" onclick="document.getElementById('file-input').click()">
            <div id="ui-upload">
                <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center text-slate-300 mb-4 mx-auto shadow-inner border border-slate-100">
                    <i class="fa-solid fa-camera text-2xl"></i>
                </div>
                <p class="font-black uppercase tracking-widest text-[10px] text-slate-400">Tirar Foto ou Abrir Galeria</p>
                <p class="text-[9px] text-slate-300 font-bold mt-1 uppercase italic">Faturas Lidl / Fornecedores</p>
            </div>
            
            <img id="preview" class="hidden w-full rounded-3xl mt-4 border-4 border-white shadow-2xl opacity-60 grayscale-[0.3]">
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="iniciarLeitura(this)">
        </div>

    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl z-50 text-slate-400 border border-white/5">
        <a href="index.html" class="p-4"><i class="fa-solid fa-house"></i></a>
        <a href="mp.html" class="p-4"><i class="fa-solid fa-box-open"></i></a>
        <a href="scan.html" class="relative -mt-14">
            <div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-100 flex items-center justify-center shadow-lg text-white">
                <i class="fa-solid fa-qrcode text-xl"></i>
            </div>
        </a>
        <a href="categorias.html" class="p-4"><i class="fa-solid fa-layer-group"></i></a>
        <a href="lista_receitas.html" class="p-4 text-orange-400"><i class="fa-solid fa-utensils"></i></a>
    </nav>

    <script>
        async function iniciarLeitura(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];

            // Setup Visual
            document.getElementById('ui-upload').classList.add('hidden');
            const preview = document.getElementById('preview');
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden');
            
            document.getElementById('status-ocr').classList.remove('hidden');
            document.getElementById('resultados').classList.add('hidden');

            try {
                // Execução do motor Tesseract
                const result = await Tesseract.recognize(file, 'por', { 
                    logger: m => {
                        if(m.status === 'recognizing text') {
                            document.getElementById('progresso-texto').innerText = `A ler dados: ${(m.progress * 100).toFixed(0)}%`;
                        }
                    }
                });

                processarTextoInteligente(result.data.text.toLowerCase());

            } catch (err) {
                console.error(err);
                alert("Erro ao processar a imagem. Tenta de novo.");
            } finally {
                document.getElementById('status-ocr').classList.add('hidden');
            }
        }

        async function processarTextoInteligente(textoBruto) {
            // Limpa quebras de linha para busca linear
            const textoFatura = textoBruto.replace(/\n/g, ' ').replace(/\s+/g, ' ');
            
            // Busca as matérias primas
            const { data: produtos } = await _supabase.from('materias_primas').select('*');
            const listaDetecoes = document.getElementById('lista-detecoes');
            listaDetecoes.innerHTML = '';
            let contador = 0;

            produtos.forEach(prod => {
                const nomeProd = prod.nome.toLowerCase();
                // Busca exata para evitar falsos positivos
                const regexBusca = new RegExp("\\b" + nomeProd + "\\b", "i");
                
                if (regexBusca.test(textoFatura)) {
                    contador++;
                    
                    const indexNome = textoFatura.indexOf(nomeProd);
                    const pedacoTexto = textoFatura.substring(indexNome, indexNome + 150);
                    
                    // PRIORIDADE 1: Procurar valor a seguir a 'x' ou '*' (Preço Unitário)
                    let matchPreco = pedacoTexto.match(/[x\*]\s*(\d+[.,]\d{2})/i);
                    
                    // PRIORIDADE 2: Procurar valor antes de 'EUR'
                    if (!matchPreco) {
                        matchPreco = pedacoTexto.match(/(\d+[.,]\d{2})\s*eur/i);
                    }

                    // PRIORIDADE 3: Qualquer decimal (será o total da linha)
                    if (!matchPreco) {
                        matchPreco = pedacoTexto.match(/(\d+[.,]\d{2})/);
                    }
                    
                    const valorEncontrado = matchPreco ? matchPreco[1].replace(',', '.') : prod.preco_atual;

                    listaDetecoes.innerHTML += `
                        <div class="bg-white p-5 rounded-[2rem] border-l-[10px] border-l-orange-500 shadow-md flex justify-between items-center animate-in fade-in slide-in-from-top-4">
                            <div class="flex-1 pr-2">
                                <p class="font-black text-slate-800 text-[11px] uppercase leading-tight">${prod.nome}</p>
                                <p class="text-[9px] text-slate-400 font-bold mt-1 uppercase italic tracking-tighter">Stock: ${prod.preco_atual}€</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="text-right">
                                    <p class="text-[8px] font-black text-orange-500 uppercase mb-1">Preço Unitário</p>
                                    <input type="number" step="0.01" value="${valorEncontrado}" id="p-${prod.id}" 
                                        class="w-20 p-2 bg-slate-50 border border-slate-200 rounded-xl text-right font-black text-sm outline-none focus:ring-2 focus:ring-orange-500 shadow-inner">
                                </div>
                                <button onclick="confirmarPreco(${prod.id})" class="bg-slate-900 text-white w-12 h-12 rounded-2xl flex items-center justify-center active:scale-95 transition-all shadow-lg">
                                    <i class="fa-solid fa-check text-lg"></i>
                                </button>
                            </div>
                        </div>`;
                }
            });

            if (contador === 0) {
                listaDetecoes.innerHTML = `
                    <div class="bg-white p-8 rounded-[2.5rem] text-center border-2 border-slate-200 shadow-inner">
                        <i class="fa-solid fa-face-sad-tear text-slate-200 text-3xl mb-3"></i>
                        <p class="text-slate-400 font-black text-[10px] uppercase tracking-widest leading-loose">
                            Não detetei produtos do stock.<br>
                            <span class="text-orange-400">Verifica se os nomes coincidem.</span>
                        </p>
                    </div>`;
            }
            
            document.getElementById('resultados').classList.remove('hidden');
            // Scroll para o topo para ver os resultados
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function confirmarPreco(id) {
            const input = document.getElementById(`p-${id}`);
            const novoValor = parseFloat(input.value);

            const { error } = await _supabase.from('materias_primas').update({ preco_atual: novoValor }).eq('id', id);

            if (!error) {
                const card = input.closest('div.bg-white');
                card.classList.replace('border-l-orange-500', 'border-l-green-500');
                card.style.opacity = '0.5';
                input.disabled = true;
                const btn = input.parentElement.nextElementSibling;
                btn.classList.replace('bg-slate-900', 'bg-green-500');
                btn.innerHTML = '<i class="fa-solid fa-check-double"></i>';
            } else {
                alert("Erro ao gravar no Supabase.");
            }
        }
    </script>
</body>
</html>
