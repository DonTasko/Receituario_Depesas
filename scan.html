<!DOCTYPE html>
<html lang="pt">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 pb-40 font-sans antialiased text-white">

    <header class="p-6">
        <h1 class="text-3xl font-black tracking-tighter text-white">Scanner</h1>
        <p class="text-slate-400 text-sm font-medium uppercase tracking-widest text-[10px]">Entrada de Mercadoria</p>
    </header>

    <main class="px-6 space-y-6">
        <div id="camera-container" class="relative aspect-[3/4] bg-slate-800 rounded-[2.5rem] border-2 border-dashed border-slate-700 overflow-hidden flex items-center justify-center">
            <video id="video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <div id="placeholder" class="text-center p-10">
                <i class="fa-solid fa-file-invoice text-5xl text-slate-600 mb-4"></i>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Clica no botão abaixo para digitalizar</p>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <button onclick="iniciarCamera()" id="btn-foto" class="bg-orange-500 hover:bg-orange-600 text-white py-5 rounded-3xl font-black uppercase tracking-widest text-xs shadow-lg active:scale-95 transition-all">
                <i class="fa-solid fa-camera mr-2"></i> Abrir Câmara
            </button>
            <button onclick="tirarFoto()" id="btn-capture" class="hidden bg-white text-slate-900 py-5 rounded-3xl font-black uppercase tracking-widest text-xs shadow-lg active:scale-95 transition-all">
                <i class="fa-solid fa-circle text-red-500 mr-2"></i> Capturar Fatura
            </button>
        </div>

        <div id="resultado-scan" class="hidden bg-white rounded-[2rem] p-6 text-slate-900 animate-fade-in">
            <h2 class="font-black text-sm uppercase tracking-tighter mb-4">Produtos Detetados</h2>
            <div id="lista-detetada" class="space-y-3">
                </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-800/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl border border-white/5 z-50">
        <a href="index.html" class="flex flex-col items-center"><i class="fa-solid fa-house text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Início</span></a>
        <a href="mp.html" class="flex flex-col items-center"><i class="fa-solid fa-box-open text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Stock</span></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-900 flex items-center justify-center shadow-lg"><i class="fa-solid fa-qrcode text-white text-2xl"></i></div></a>
        <a href="categorias.html" class="flex flex-col items-center"><i class="fa-solid fa-layer-group text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Categorias</span></a>
        <a href="receitas.html" class="flex flex-col items-center"><i class="fa-solid fa-utensils text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Receitas</span></a>
    </nav>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnFoto = document.getElementById('btn-foto');
        const btnCapture = document.getElementById('btn-capture');
        const placeholder = document.getElementById('placeholder');

        async function iniciarCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                video.classList.remove('hidden');
                placeholder.classList.add('hidden');
                btnFoto.classList.add('hidden');
                btnCapture.classList.remove('hidden');
            } catch (err) {
                alert("Erro ao aceder à câmara. Verifica as permissões.");
            }
        }

        function tirarFoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Aqui paramos a câmara
            const stream = video.srcObject;
            const tracks = stream.getTracks();
            tracks.forEach(track => track.stop());

            video.classList.add('hidden');
            btnCapture.classList.add('hidden');
            
            // Simulação de processamento (Próximo Passo: OCR)
            alert("Imagem capturada! A processar dados da fatura...");
            processarFatura();
        }

        function processarFatura() {
            // Esta função será onde ligaremos a IA para ler a foto
            document.getElementById('resultado-scan').classList.remove('hidden');
            const lista = document.getElementById('lista-detetada');
            lista.innerHTML = `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <div>
                        <p class="font-black text-xs uppercase">Exemplo: Picanha</p>
                        <p class="text-[10px] text-slate-500 font-bold">Detetado: 25.00€</p>
                    </div>
                    <button class="bg-orange-500 text-white px-4 py-2 rounded-xl text-[10px] font-black">ATUALIZAR</button>
                </div>
            `;
        }
    </script>
</body>
</html>
