<!DOCTYPE html>
<html lang="pt">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Pro - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 pb-40 font-sans antialiased text-white">

    <header class="p-6">
        <h1 class="text-3xl font-black tracking-tighter">Scanner</h1>
        <p class="text-orange-500 text-[10px] font-black uppercase tracking-widest text-left">Leitura & Histórico</p>
    </header>

    <main class="px-6 space-y-6">
        <div id="camera-container" class="relative aspect-[3/4] bg-slate-800 rounded-[2.5rem] border-2 border-dashed border-slate-700 overflow-hidden flex items-center justify-center">
            <video id="video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <div id="placeholder" class="text-center p-10">
                <i class="fa-solid fa-camera text-4xl text-slate-600 mb-4"></i>
                <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest">Alinha a Fatura</p>
            </div>
            <div id="loading-overlay" class="hidden absolute inset-0 bg-slate-900/90 backdrop-blur-md flex flex-col items-center justify-center z-20">
                <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p id="status-ocr" class="text-[10px] font-black uppercase tracking-widest text-orange-500">A processar...</p>
            </div>
        </div>

        <div id="controles" class="grid grid-cols-1 gap-4">
            <button onclick="iniciarCamera()" id="btn-foto" class="bg-white text-slate-900 py-5 rounded-3xl font-black uppercase tracking-widest text-xs">Abrir Câmara</button>
            <button onclick="tirarFoto()" id="btn-capture" class="hidden bg-orange-500 text-white py-5 rounded-3xl font-black uppercase tracking-widest text-xs">Analisar Agora</button>
        </div>

        <div id="resultado-scan" class="hidden bg-white rounded-[2.5rem] p-6 text-slate-900 animate-fade-in shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-black text-xs uppercase text-slate-400">Items Encontrados</h2>
                <select id="select-fornecedor" class="bg-slate-100 border-none p-2 rounded-xl text-[10px] font-black uppercase text-slate-600">
                    <option value="">Sem Fornecedor</option>
                </select>
            </div>
            <div id="lista-detetada" class="space-y-4"></div>
            <button onclick="location.reload()" class="w-full mt-6 py-4 text-slate-400 font-bold text-[10px] uppercase">Cancelar</button>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-800/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl border border-white/5 z-50 text-slate-400">
        <a href="index.html"><i class="fa-solid fa-house"></i></a>
        <a href="mp.html"><i class="fa-solid fa-box-open"></i></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-slate-900 flex items-center justify-center shadow-lg"><i class="fa-solid fa-qrcode text-white text-2xl"></i></div></a>
        <a href="categorias.html"><i class="fa-solid fa-layer-group"></i></a>
        <a href="receitas.html"><i class="fa-solid fa-utensils"></i></a>
    </nav>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading-overlay');

        // Carrega fornecedores no select
        async function loadFornecedores() {
            const { data } = await _supabase.from('fornecedores').select('*');
            const select = document.getElementById('select-fornecedor');
            if(data) data.forEach(f => {
                select.innerHTML += `<option value="${f.id}">${f.nome}</option>`;
            });
        }

        async function iniciarCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                video.classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
                document.getElementById('btn-foto').classList.add('hidden');
                document.getElementById('btn-capture').classList.remove('hidden');
                loadFornecedores();
            } catch (err) { alert("Erro de câmara."); }
        }

        async function tirarFoto() {
            loading.classList.remove('hidden');
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            video.srcObject.getTracks().forEach(track => track.stop());

            const result = await Tesseract.recognize(canvas.toDataURL('image/png'), 'por');
            processarInteligente(result.data.text);
        }

        async function processarInteligente(textoBruto) {
            loading.classList.add('hidden');
            document.getElementById('resultado-scan').classList.remove('hidden');
            document.getElementById('controles').classList.add('hidden');
            
            const { data: produtosStock } = await _supabase.from('materias_primas').select('*');
            const listaUI = document.getElementById('lista-detetada');
            const textoCheck = textoBruto.toLowerCase();
            
            produtosStock.forEach(prod => {
                if (textoCheck.includes(prod.nome.toLowerCase())) {
                    listaUI.innerHTML += `
                        <div class="bg-slate-50 p-5 rounded-[2rem] border border-slate-100 shadow-sm">
                            <h3 class="font-black text-slate-800 text-[11px] uppercase mb-4">${prod.nome}</h3>
                            <div class="grid grid-cols-2 gap-3 mb-4">
                                <input type="number" id="pr-${prod.id}" value="${prod.preco_atual}" step="0.01" class="bg-white border p-3 rounded-2xl text-xs font-bold" placeholder="Preço">
                                <input type="number" id="qt-${prod.id}" value="1" class="bg-white border p-3 rounded-2xl text-xs font-bold" placeholder="Qtd">
                            </div>
                            <button onclick="confirmarEntrada(${prod.id}, document.getElementById('pr-${prod.id}').value, document.getElementById('qt-${prod.id}').value)" 
                                    class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase text-[9px] tracking-widest">Confirmar</button>
                        </div>
                    `;
                }
            });
        }

        async function confirmarEntrada(mpId, preco, qtd) {
            const fornId = document.getElementById('select-fornecedor').value;
            try {
                // 1. Criar Registo no Histórico
                await _supabase.from('historico_compras').insert([{
                    mp_id: mpId,
                    quantidade: parseFloat(qtd),
                    preco_unitario: parseFloat(preco),
                    fornecedor_id: fornId ? parseInt(fornId) : null
                }]);

                // 2. Atualizar Tabela Principal
                const { data: p } = await _supabase.from('materias_primas').select('stock_atual').eq('id', mpId).single();
                await _supabase.from('materias_primas').update({
                    preco_atual: parseFloat(preco),
                    stock_atual: parseFloat(p.stock_atual || 0) + parseFloat(qtd)
                }).eq('id', mpId);

                alert("Registo guardado no histórico!");
                location.reload();
            } catch (e) { alert("Erro ao guardar."); }
        }
    </script>
</body>
</html>
