<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 h-screen flex flex-col text-white font-sans">

    <header class="p-6 flex justify-between items-center">
        <a href="index.html" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></a>
        <span class="text-[10px] font-black uppercase tracking-[0.2em]">Scanner de Faturas</span>
        <div class="w-10"></div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 space-y-8">
        <div class="w-full aspect-[3/4] bg-white/5 rounded-[3rem] border-2 border-dashed border-white/20 flex flex-col items-center justify-center relative overflow-hidden">
            <i class="fa-solid fa-file-invoice text-5xl text-white/20 mb-4"></i>
            <p class="text-xs font-bold text-white/40 uppercase">Câmara ou Ficheiro</p>
            <img id="preview" class="absolute inset-0 w-full h-full object-cover hidden">
        </div>

        <div class="w-full space-y-4">
            <button onclick="document.getElementById('file-input').click()" class="w-full bg-white text-slate-900 p-5 rounded-[2rem] font-black uppercase tracking-widest flex items-center justify-center gap-3">
                <i class="fa-solid fa-camera"></i> Digitalizar Agora
            </button>

            <button onclick="document.getElementById('file-input').click()" class="w-full bg-white/10 text-white p-5 rounded-[2rem] font-black uppercase tracking-widest flex items-center justify-center gap-3 border border-white/10">
                <i class="fa-solid fa-upload"></i> Carregar do Telemóvel
            </button>
        </div>

        <input type="file" id="file-input" accept="image/*,application/pdf" class="hidden" onchange="processarFicheiro(this)">
    </main>

    <script>
        function processarFicheiro(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const preview = document.getElementById('preview');
                
                // Mostrar preview se for imagem
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        preview.src = e.target.result;
                        preview.classList.remove('hidden');
                    }
                    reader.readAsDataURL(file);
                }

                alert("Ficheiro '" + file.name + "' carregado!\n\nA ligar ao motor de IA para extrair preços...");
                
                // Aqui no futuro ligamos ao OCR (Tesseract.js ou Google Vision)
                // Por agora, simulamos a leitura
                setTimeout(() => {
                    console.log("A analisar fatura...");
                }, 2000);
            }
        }
    </script>
</body>
</html>
