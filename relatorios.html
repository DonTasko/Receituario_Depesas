async function salvarReceitaCompleta() {
    const btn = document.getElementById('btn-lançar');
    const nome = document.getElementById('nome-receita').value;
    const preco = document.getElementById('preco-venda').value;

    if(!nome || ingredientesParaSalvar.length === 0) {
        alert("Preenche o nome e adiciona pelo menos um ingrediente!");
        return;
    }

    btn.innerText = "A GUARDAR...";
    btn.disabled = true;

    try {
        // 1. Inserir na tabela 'receitas' (minúsculo)
        const { data: receitaCriada, error: errR } = await _supabase
            .from('receitas') 
            .insert([{ nome: nome, preco_venda: parseFloat(preco) }])
            .select();

        if (errR) throw errR;

        const receitaId = receitaCriada[0].id;

        // 2. Preparar linhas para 'ingredientes_receita' (minúsculo)
        const linhasIngredientes = ingredientesParaSalvar.map(ing => ({
            receita_id: receitaId,
            mp_id: parseInt(ing.mp_id),
            quantidade: parseFloat(ing.quantidade)
        }));

        // 3. Inserir os ingredientes
        const { error: errI } = await _supabase
            .from('ingredientes_receita')
            .insert(linhasIngredientes);

        if (errI) throw errI;

        alert("Receita e ingredientes lançados com sucesso!");
        window.location.reload();

    } catch (error) {
        console.error("Erro detalhado:", error);
        alert("Erro ao guardar: " + (error.message || "Verifica o console"));
        btn.innerText = "LANÇAR RECEITA";
        btn.disabled = false;
    }
}
