<body class="bg-[#F8FAFC] pb-32">

    <header class="p-6 bg-white rounded-b-[3rem] shadow-sm sticky top-0 z-40">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter">Relatórios</h1>
            <button class="bg-slate-100 p-3 rounded-2xl text-slate-500"><i class="fa-solid fa-calendar-days"></i></button>
        </div>
        
        <div class="flex bg-slate-100 p-1 rounded-2xl">
            <button class="flex-1 py-2 text-[10px] font-black uppercase rounded-xl bg-white shadow-sm text-slate-900">Mensal</button>
            <button class="flex-1 py-2 text-[10px] font-black uppercase text-slate-500">Trimestral</button>
            <button class="flex-1 py-2 text-[10px] font-black uppercase text-slate-500">Anual</button>
        </div>
    </header>

    <main class="p-6 space-y-6">

        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Gasto Acumulado</p>
                    <h3 class="text-2xl font-black text-slate-900">12.450€</h3>
                    <p class="text-xs text-emerald-500 font-bold mt-1"><i class="fa-solid fa-arrow-down"></i> -4% vs Mês Anterior</p>
                </div>
                <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
            </div>
            <div class="h-40">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <div class="bg-slate-900 rounded-[2.5rem] p-6 text-white shadow-xl shadow-slate-200">
            <h3 class="text-sm font-black uppercase tracking-widest mb-6 flex items-center gap-2">
                <i class="fa-solid fa-bolt text-orange-500"></i> Alertas de Inflação
            </h3>
            
            <div class="space-y-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center text-orange-400 font-black text-xs">+22%</div>
                        <div>
                            <p class="font-bold text-sm leading-none">Óleo Vegetal</p>
                            <p class="text-[10px] text-slate-400 mt-1 italic">Fornecedor: Distribuidora X</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-slate-300 italic">Sugestão:</p>
                        <p class="text-[10px] font-black text-orange-400 uppercase">Trocar Fornecedor</p>
                    </div>
                </div>

                <div class="flex items-center justify-between opacity-80">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center text-red-400 font-black text-xs">+15%</div>
                        <div>
                            <p class="font-bold text-sm leading-none">Peito de Frango</p>
                            <p class="text-[10px] text-slate-400 mt-1 italic">Média de Mercado: 6.50€</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-slate-300 italic">Impacto:</p>
                        <p class="text-[10px] font-black text-red-400 uppercase">-1.2% Margem Total</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-[2.5rem] shadow-sm border border-slate-100">
                <p class="text-[9px] font-black text-slate-400 uppercase mb-3">Comida (Food)</p>
                <div class="flex items-end justify-between">
                    <span class="text-xl font-black text-slate-800">68%</span>
                    <div class="w-12 h-24 bg-slate-50 rounded-full relative overflow-hidden">
                        <div class="absolute bottom-0 w-full bg-orange-500 h-[68%] rounded-full"></div>
                    </div>
                </div>
            </div>
            <div class="bg-white p-5 rounded-[2.5rem] shadow-sm border border-slate-100">
                <p class="text-[9px] font-black text-slate-400 uppercase mb-3">Bebida (Bev)</p>
                <div class="flex items-end justify-between">
                    <span class="text-xl font-black text-slate-800">22%</span>
                    <div class="w-12 h-24 bg-slate-50 rounded-full relative overflow-hidden">
                        <div class="absolute bottom-0 w-full bg-blue-500 h-[22%] rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Gráfico de Tendência Simples
        const ctx = document.getElementById('trendChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Sem1', 'Sem2', 'Sem3', 'Sem4'],
                datasets: [{
                    data: [3200, 2800, 3500, 2950],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { display: false }
                }
            }
        });
    </script>
</body>
