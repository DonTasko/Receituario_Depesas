<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body class="bg-slate-100 pb-32 font-sans antialiased text-slate-900">

    <header class="p-8 bg-slate-900 rounded-b-[3.5rem] shadow-2xl">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-orange-400 text-[10px] font-black uppercase tracking-[0.2em] mb-1">Sistema de Gestão</p>
                <h1 class="text-3xl font-black tracking-tighter text-white">Dashboard</h1>
            </div>
            <div class="w-14 h-14 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center text-white border border-white/20">
                <i class="fa-solid fa-chart-pie text-xl"></i>
            </div>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mt-8">
            <div class="bg-white/5 backdrop-blur-sm p-4 rounded-3xl border border-white/10">
                <p class="text-[8px] font-black uppercase text-white/40 tracking-widest mb-1">Receitas Ativas</p>
                <p id="count-receitas" class="text-xl font-black text-white">--</p>
            </div>
            <div class="bg-white/5 backdrop-blur-sm p-4 rounded-3xl border border-white/10">
                <p class="text-[8px] font-black uppercase text-white/40 tracking-widest mb-1">Artigos Stock</p>
                <p id="count-mp" class="text-xl font-black text-white">--</p>
            </div>
        </div>
    </header>

    <main class="p-6 -mt-6">
        <div class="grid grid-cols-2 gap-4">
            
            <a href="lista_receitas.html" class="bg-white p-6 rounded-[2.5rem] shadow-lg shadow-slate-200/50 flex flex-col items-start gap-4 active:scale-95 transition-all border border-white">
                <div class="w-12 h-12 bg-orange-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-orange-200">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <span class="font-black text-xs uppercase tracking-tight text-slate-800 block">Receitas</span>
                    <span class="text-[9px] text-slate-400 font-bold uppercase">Fichas Técnicas</span>
                </div>
            </a>

            <a href="mp.html" class="bg-white p-6 rounded-[2.5rem] shadow-lg shadow-slate-200/50 flex flex-col items-start gap-4 active:scale-95 transition-all border border-white">
                <div class="w-12 h-12 bg-blue-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <i class="fa-solid fa-box-open text-lg"></i>
                </div>
                <div>
                    <span class="font-black text-xs uppercase tracking-tight text-slate-800 block">Stock MP</span>
                    <span class="text-[9px] text-slate-400 font-bold uppercase">Preços e Matéria</span>
                </div>
            </a>

            <a href="categorias.html" class="bg-white p-6 rounded-[2.5rem] shadow-lg shadow-slate-200/50 flex flex-col items-start gap-4 active:scale-95 transition-all border border-white">
                <div class="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                    <i class="fa-solid fa-layer-group text-lg"></i>
                </div>
                <div>
                    <span class="font-black text-xs uppercase tracking-tight text-slate-800 block">Gestão</span>
                    <span class="text-[9px] text-slate-400 font-bold uppercase">Fornecedores</span>
                </div>
            </a>

            <a href="scan.html" class="bg-gradient-to-br from-orange-500 to-orange-600 p-6 rounded-[2.5rem] shadow-xl shadow-orange-200 flex flex-col items-start gap-4 active:scale-95 transition-all border-t border-white/20">
                <div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-white">
                    <i class="fa-solid fa-qrcode text-lg"></i>
                </div>
                <div>
                    <span class="font-black text-xs uppercase tracking-tight text-white block">Scanner IA</span>
                    <span class="text-[9px] text-orange-100 font-bold uppercase">Ler Faturas</span>
                </div>
            </a>

        </div>

        <div class="mt-6 bg-white p-6 rounded-[2.5rem] border border-slate-200 shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-400">
                    <i class="fa-solid fa-history text-sm"></i>
                </div>
                <div>
                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Última Ação</p>
                    <p class="text-xs font-bold text-slate-700">Consultar histórico de preços</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right text-slate-300 text-xs mr-2"></i>
        </div>
    </main>

    <script>
        async function loadStats() {
            try {
                const { count: countR } = await _supabase.from('receitas').select('*', { count: 'exact', head: true });
                const { count: countM } = await _supabase.from('materias_primas').select('*', { count: 'exact', head: true });
                
                document.getElementById('count-receitas').innerText = countR || 0;
                document.getElementById('count-mp').innerText = countM || 0;
            } catch (e) {
                console.error("Erro ao carregar stats:", e);
            }
        }
        document.addEventListener('DOMContentLoaded', loadStats);
    </script>
</body>
</html>
