<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 pb-32 font-sans antialiased text-slate-900">

    <header class="p-8 bg-white border-b border-slate-200 rounded-b-[3rem] shadow-sm">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em]">Bem-vindo ao Tasko</p>
                <h1 class="text-3xl font-black tracking-tighter">Dashboard</h1>
            </div>
            <div class="w-12 h-12 bg-orange-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-orange-200">
                <i class="fa-solid fa-user-tie"></i>
            </div>
        </div>
    </header>

    <main class="p-6 space-y-6">
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-200 shadow-sm">
                <p class="text-[8px] font-black uppercase text-slate-400 tracking-widest mb-1">Total Receitas</p>
                <p id="count-receitas" class="text-2xl font-black text-slate-900">--</p>
            </div>
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-200 shadow-sm">
                <p class="text-[8px] font-black uppercase text-slate-400 tracking-widest mb-1">Artigos Stock</p>
                <p id="count-mp" class="text-2xl font-black text-slate-900">--</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <a href="lista_receitas.html" class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm flex flex-col items-center justify-center gap-4 hover:scale-[1.02] transition-all active:scale-95">
                <div class="w-16 h-16 bg-orange-100 rounded-[1.5rem] flex items-center justify-center text-orange-600 text-2xl">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <span class="font-black text-[11px] uppercase tracking-widest text-slate-600">Receitas</span>
            </a>

            <a href="mp.html" class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm flex flex-col items-center justify-center gap-4 hover:scale-[1.02] transition-all active:scale-95">
                <div class="w-16 h-16 bg-blue-100 rounded-[1.5rem] flex items-center justify-center text-blue-600 text-2xl">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <span class="font-black text-[11px] uppercase tracking-widest text-slate-600">Stock MP</span>
            </a>

            <a href="categorias.html" class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm flex flex-col items-center justify-center gap-4 hover:scale-[1.02] transition-all active:scale-95">
                <div class="w-16 h-16 bg-purple-100 rounded-[1.5rem] flex items-center justify-center text-purple-600 text-2xl">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <span class="font-black text-[11px] uppercase tracking-widest text-slate-600">Gestão</span>
            </a>

            <a href="scan.html" class="bg-slate-900 p-8 rounded-[2.5rem] shadow-xl flex flex-col items-center justify-center gap-4 hover:scale-[1.02] transition-all active:scale-95">
                <div class="w-16 h-16 bg-orange-500 rounded-[1.5rem] flex items-center justify-center text-white text-2xl">
                    <i class="fa-solid fa-qrcode"></i>
                </div>
                <span class="font-black text-[11px] uppercase tracking-widest text-white">Scanner</span>
            </a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        async function loadStats() {
            const { count: countR } = await _supabase.from('receitas').select('*', { count: 'exact', head: true });
            const { count: countM } = await _supabase.from('materias_primas').select('*', { count: 'exact', head: true });
            
            document.getElementById('count-receitas').innerText = countR || 0;
            document.getElementById('count-mp').innerText = countM || 0;
        }
        document.addEventListener('DOMContentLoaded', loadStats);
    </script>
</body>
</html>
