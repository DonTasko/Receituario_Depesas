<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RestoCheck - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 pb-32 font-sans antialiased text-slate-900">

    <nav class="sticky top-0 z-30 bg-slate-900 text-white p-5 rounded-b-[2rem] shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-xs text-slate-400 font-medium">Bem-vindo, DonTasko</p>
                <h1 class="text-xl font-bold italic tracking-tighter">RESTO<span class="text-orange-500 italic">CHECK</span></h1>
            </div>
            <div class="relative">
                <i class="fa-solid fa-circle-user text-2xl text-slate-400"></i>
            </div>
        </div>

        <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
            <div class="flex justify-between items-end mb-2">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Gastos Totais</span>
                <span class="text-2xl font-black text-orange-400">4.285€</span>
            </div>
            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                <div class="bg-orange-500 h-full w-[75%] shadow-[0_0_10px_rgba(249,115,22,0.5)]"></div>
            </div>
        </div>
    </nav>

    <main class="px-5 -mt-6">
        
        <div class="flex gap-4 overflow-x-auto no-scrollbar snap-x mb-8 pt-2">
            <div class="min-w-[160px] snap-center p-4 rounded-3xl bg-white border border-slate-100 shadow-sm">
                <p class="text-xs font-bold text-red-500"><i class="fa-solid fa-arrow-trend-up mr-2"></i>Carne</p>
                <p class="text-[10px] text-slate-500 leading-tight mt-1">Preço subiu 12% na última fatura.</p>
            </div>
            <div class="min-w-[160px] snap-center p-4 rounded-3xl bg-white border border-slate-100 shadow-sm">
                <p class="text-xs font-bold text-emerald-500"><i class="fa-solid fa-check mr-2"></i>Margem</p>
                <p class="text-[10px] text-slate-500 leading-tight mt-1">Média de 72% nos pratos principais.</p>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] p-6 shadow-sm mb-6 border border-slate-100">
            <h3 class="font-bold text-slate-800 mb-6">Gastos por Categoria</h3>
            <div class="h-56">
                <canvas id="mainDashboardChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <a href="scan.html" class="bg-orange-500 text-white p-6 rounded-[2rem] shadow-lg shadow-orange-100 flex flex-col items-center justify-center gap-2 active:scale-95 transition-all">
                <i class="fa-solid fa-qrcode text-2xl"></i>
                <span class="font-black text-[10px] uppercase tracking-widest text-center leading-tight">Scannear<br>Fatura</span>
            </a>
            <a href="relatorios.html" class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 active:scale-95 transition-all">
                <i class="fa-solid fa-chart-pie text-2xl text-blue-500"></i>
                <span class="font-black text-[10px] text-slate-700 uppercase tracking-widest">Ver Análises</span>
            </a>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-4 shadow-2xl border border-white/10 z-50">
        <a href="index.html" class="text-orange-400 flex flex-col items-center">
            <i class="fa-solid fa-house"></i>
            <span class="text-[8px] mt-1 font-bold uppercase">Início</span>
        </a>
        <a href="mp.html" class="text-slate-400 flex flex-col items-center">
            <i class="fa-solid fa-box-open"></i>
            <span class="text-[8px] mt-1 font-bold uppercase">Stock</span>
        </a>
        <a href="scan.html" class="bg-orange-500 w-14 h-14 rounded-full -mt-12 border-[6px] border-slate-50 flex items-center justify-center text-white text-xl shadow-lg shadow-orange-200">
            <i class="fa-solid fa-qrcode"></i>
        </a>
        <a href="categorias.html" class="text-slate-400 flex flex-col items-center">
            <i class="fa-solid fa-layer-group"></i>
            <span class="text-[8px] mt-1 font-bold uppercase">Categorias</span>
        </a>
        <a href="receitas.html" class="text-slate-400 flex flex-col items-center">
            <i class="fa-solid fa-utensils"></i>
            <span class="text-[8px] mt-1 font-bold uppercase">Receitas</span>
        </a>
    </nav>

    <script>
        const ctx = document.getElementById('mainDashboardChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Carne', 'Bebida', 'Outros'],
                datasets: [{
                    data: [1850, 1100, 415],
                    backgroundColor: ['#f97316', '#3b82f6', '#94a3b8'],
                    borderRadius: 15,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { display: false },
                    x: { grid: { display: false }, border: { display: false } }
                }
            }
        });
    </script>
</body>
</html>
