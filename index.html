<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RestoCheck - Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 pb-28 font-sans antialiased text-slate-900">

    <nav class="sticky top-0 z-30 bg-slate-900 text-white p-5 rounded-b-[2rem] shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-xs text-slate-400 font-medium">Bom dia, Chef</p>
                <h1 class="text-xl font-bold">Estado do Negócio</h1>
            </div>
            <div class="relative">
                <div class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-slate-900"></div>
                <i class="fa-solid fa-bell text-xl"></i>
            </div>
        </div>

        <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
            <div class="flex justify-between items-end mb-2">
                <span class="text-xs font-semibold text-slate-400 uppercase">Compras do Mês</span>
                <span class="text-2xl font-black text-orange-400">4.285€</span>
            </div>
            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                <div class="bg-orange-500 h-full w-[75%] shadow-[0_0_10px_rgba(249,115,22,0.5)]"></div>
            </div>
            <p class="text-[10px] text-slate-500 mt-2 text-right">75% do orçamento mensal atingido</p>
        </div>
    </nav>

    <main class="px-5 -mt-6">
        
        <div class="flex gap-4 overflow-x-auto no-scrollbar snap-x mb-8">
            <div class="min-w-[160px] snap-center p-4 rounded-3xl bg-red-50 border border-red-100 shadow-sm">
                <div class="w-8 h-8 bg-red-500 text-white rounded-full flex items-center justify-center mb-3">
                    <i class="fa-solid fa-arrow-trend-up text-xs"></i>
                </div>
                <p class="text-xs font-bold text-red-900">Alerta: Carne</p>
                <p class="text-[10px] text-red-700 leading-tight">+12% subida no preço médio</p>
            </div>

            <div class="min-w-[160px] snap-center p-4 rounded-3xl bg-emerald-50 border border-emerald-100 shadow-sm">
                <div class="w-8 h-8 bg-emerald-500 text-white rounded-full flex items-center justify-center mb-3">
                    <i class="fa-solid fa-check text-xs"></i>
                </div>
                <p class="text-xs font-bold text-emerald-900">Food Cost</p>
                <p class="text-[10px] text-emerald-700 leading-tight">Dentro da meta (28%)</p>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] p-6 shadow-sm mb-6 border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-slate-800">Gastos por Categoria</h3>
                <select class="text-[10px] font-bold bg-slate-100 border-none rounded-lg px-2 py-1">
                    <option>Esta Semana</option>
                    <option>Este Mês</option>
                </select>
            </div>
            <div class="h-64 relative">
                <canvas id="mainDashboardChart"></canvas>
            </div>
        </div>

        <button class="w-full bg-orange-500 hover:bg-orange-600 text-white p-5 rounded-[2rem] shadow-lg shadow-orange-200 flex items-center justify-center gap-4 active:scale-95 transition-all">
            <i class="fa-solid fa-qrcode text-2xl"></i>
            <span class="font-bold uppercase tracking-wider">Scannear Fatura</span>
        </button>

    </main>

    <div class="fixed bottom-6 left-5 right-5 h-16 bg-slate-900/95 backdrop-blur-md rounded-2xl flex items-center justify-around px-4 shadow-2xl z-50 border border-white/10">
        <button class="text-orange-400 flex flex-col items-center"><i class="fa-solid fa-house"></i><span class="text-[9px] mt-1">Início</span></button>
        <button class="text-slate-400 flex flex-col items-center"><i class="fa-solid fa-truck"></i><span class="text-[9px] mt-1">Forn</span></button>
        <button class="text-slate-400 flex flex-col items-center"><i class="fa-solid fa-box"></i><span class="text-[9px] mt-1">Stock</span></button>
        <button class="text-slate-400 flex flex-col items-center"><i class="fa-solid fa-utensils"></i><span class="text-[9px] mt-1">Receitas</span></button>
    </div>

    <script>
        // Configuração do Gráfico de Barras Moderno
        const ctx = document.getElementById('mainDashboardChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Carne', 'Peixe', 'Bebida', 'Outros'],
                datasets: [{
                    label: 'Gastos (€)',
                    data: [1850, 920, 1100, 415],
                    backgroundColor: ['#f97316', '#3b82f6', '#8b5cf6', '#94a3b8'],
                    borderRadius: 12,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { display: false, grid: { display: false } },
                    x: { grid: { display: false }, border: { display: false } }
                }
            }
        });
    </script>
</body>
</html>
