<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#F8FAFC] pb-40 font-sans">
    <header class="p-6">
        <h1 class="text-3xl font-black text-slate-900 tracking-tighter">Categorias</h1>
        <p class="text-slate-500 text-sm font-medium">Orçamento vs. Gasto Real</p>
    </header>

    <main class="px-6 space-y-4">
        <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-100 relative overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 w-2 bg-red-500"></div>
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center text-red-500">
                        <i class="fa-solid fa-drumstick-bite text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">Proteínas</h3>
                        <p class="text-[10px] text-slate-400 font-bold uppercase underline">14 Artigos</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-sm font-black text-red-600">1.850€</p>
                </div>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div class="bg-red-500 h-full w-full"></div>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-100 relative overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 w-2 bg-emerald-500"></div>
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-500">
                        <i class="fa-solid fa-wine-glass text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">Bebidas</h3>
                        <p class="text-[10px] text-slate-400 font-bold uppercase underline">42 Artigos</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-sm font-black text-slate-800">920€</p>
                </div>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div class="bg-emerald-500 h-full w-[65%]"></div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl border border-white/10 z-50">
        <a href="index.html" class="flex flex-col items-center"><i class="fa-solid fa-house text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Início</span></a>
        <a href="mp.html" class="flex flex-col items-center"><i class="fa-solid fa-box-open text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Stock</span></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-[#F8FAFC] flex items-center justify-center shadow-lg active:scale-90 transition-transform"><i class="fa-solid fa-qrcode text-white text-2xl"></i></div></a>
        <a href="categorias.html" class="flex flex-col items-center"><i class="fa-solid fa-layer-group text-orange-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-orange-400">Categorias</span></a>
        <a href="receitas.html" class="flex flex-col items-center"><i class="fa-solid fa-utensils text-slate-400 text-lg mb-1"></i><span class="text-[8px] font-black uppercase text-slate-500">Receitas</span></a>
    </nav>
</body>
</html>
