<body class="bg-[#F8FAFC] pb-32">

    <header class="p-6">
        <div class="flex justify-between items-start mb-2">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tighter">Categorias</h1>
                <p class="text-slate-500 text-sm font-medium">Orçamento vs. Gasto Real</p>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 text-center">
                <p class="text-[9px] font-black text-slate-400 uppercase leading-none">Total</p>
                <p class="text-lg font-black text-slate-900">4.2k€</p>
            </div>
        </div>
    </header>

    <main class="px-6 space-y-4">

        <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-100 relative overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 w-2 bg-red-500"></div>
            
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center text-red-500">
                        <i class="fa-solid fa-drumstick-bite text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800">Proteínas</h3>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">14 Artigos ativado</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-sm font-black text-red-600">1.850€</p>
                    <p class="text-[9px] text-slate-400 font-bold uppercase">Gasto</p>
                </div>
            </div>

            <div class="space-y-2">
                <div class="flex justify-between text-[10px] font-black uppercase tracking-tighter">
                    <span class="text-slate-400">Progresso do Orçamento</span>
                    <span class="text-red-500 underline">Excedido em 12%</span>
                </div>
                <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                    <div class="bg-red-500 h-full w-full shadow-[0_0_12px_rgba(239,68,68,0.4)]"></div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-100 relative overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 w-2 bg-emerald-500"></div>
            
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-500">
                        <i class="fa-solid fa-wine-glass text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800">Bebidas & Garrafeira</h3>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">42 Artigos</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-sm font-black text-slate-800">920€</p>
                    <p class="text-[9px] text-slate-400 font-bold uppercase text-emerald-600 italic">Sob Controlo</p>
                </div>
            </div>

            <div class="space-y-2">
                <div class="flex justify-between text-[10px] font-black uppercase tracking-tighter text-slate-400">
                    <span>Progresso do Orçamento</span>
                    <span>65%</span>
                </div>
                <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                    <div class="bg-emerald-500 h-full w-[65%] shadow-[0_0_12px_rgba(16,185,129,0.4)]"></div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-orange-50 rounded-2xl flex items-center justify-center text-orange-500">
                        <i class="fa-solid fa-carrot text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">Hortícolas & Fruta</h3>
                        <p class="text-[10px] text-slate-400 font-bold uppercase underline">Ver 22 Artigos</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-300"></i>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-4 shadow-2xl border border-white/10 z-50">
        <button class="text-slate-400 text-xl"><i class="fa-solid fa-chart-pie"></i></button>
        <button class="text-slate-400 text-xl"><i class="fa-solid fa-box-open"></i></button>
        <div class="bg-orange-500 w-14 h-14 rounded-full -mt-10 border-[6px] border-[#F8FAFC] flex items-center justify-center text-white text-xl shadow-lg shadow-orange-200">
            <i class="fa-solid fa-qrcode"></i>
        </div>
        <button class="text-orange-400 text-xl"><i class="fa-solid fa-layer-group"></i></button>
        <button class="text-slate-400 text-xl"><i class="fa-solid fa-utensils"></i></button>
    </nav>

</body>
