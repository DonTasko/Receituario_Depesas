<!DOCTYPE html>
<html lang="pt">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão - RestoCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#F8FAFC] pb-40 font-sans antialiased text-slate-900">

    <header class="p-6">
        <h1 class="text-3xl font-black text-slate-900 tracking-tighter">Gestão</h1>
        <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest">Configuração do Sistema</p>
    </header>

    <main class="px-6 space-y-8">
        
        <section class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-plus text-sm"></i>
                </div>
                <h2 class="font-black text-sm uppercase tracking-tight">Novo Artigo de Stock</h2>
            </div>

            <form id="form-artigo" class="space-y-4">
                <input type="text" id="artigo-nome" placeholder="Nome (ex: Picanha)" class="w-full bg-slate-50 border-none p-4 rounded-2xl text-xs font-bold" required>
                <div class="grid grid-cols-2 gap-4">
                    <select id="artigo-unidade" class="bg-slate-50 border-none p-4 rounded-2xl text-xs font-bold text-slate-50">
                        <option value="kg">Quilo (kg)</option>
                        <option value="un">Unidade (un)</option>
                        <option value="L">Litro (L)</option>
                    </select>
                    <input type="number" id="artigo-preco" placeholder="Preço (€)" step="0.01" class="w-full bg-slate-50 border-none p-4 rounded-2xl text-xs font-bold" required>
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95 transition-all">Criar Artigo</button>
            </form>
        </section>

        <section class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-truck text-sm"></i>
                </div>
                <h2 class="font-black text-sm uppercase tracking-tight">Novo Fornecedor</h2>
            </div>

            <div class="flex gap-2">
                <input type="text" id="forn-nome" placeholder="Nome do Fornecedor" class="flex-1 bg-slate-50 border-none p-4 rounded-2xl text-xs font-bold">
                <button onclick="addFornecedor()" class="bg-slate-100 px-6 rounded-2xl text-slate-900"><i class="fa-solid fa-check"></i></button>
            </div>
            
            <div id="lista-fornecedores" class="mt-4 flex flex-wrap gap-2 text-[10px] font-bold uppercase">
                </div>
        </section>

    </main>

    <nav class="fixed bottom-6 left-6 right-6 h-20 bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl border border-white/10 z-50 text-slate-400">
        <a href="index.html" class="flex flex-col items-center"><i class="fa-solid fa-house"></i></a>
        <a href="mp.html" class="flex flex-col items-center"><i class="fa-solid fa-box-open"></i></a>
        <a href="scan.html" class="relative -mt-14"><div class="bg-orange-500 w-16 h-16 rounded-full border-[6px] border-[#F8FAFC] flex items-center justify-center shadow-lg"><i class="fa-solid fa-qrcode text-white"></i></div></a>
        <a href="categorias.html" class="flex flex-col items-center"><i class="fa-solid fa-layer-group text-orange-400"></i></a>
        <a href="receitas.html" class="flex flex-col items-center"><i class="fa-solid fa-utensils"></i></a>
    </nav>

    <script>
        // --- GESTÃO DE ARTIGOS ---
        document.getElementById('form-artigo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "A GUARDAR...";

            const { error } = await _supabase.from('materias_primas').insert([{
                nome: document.getElementById('artigo-nome').value,
                unidade: document.getElementById('artigo-unidade').value,
                preco_atual: parseFloat(document.getElementById('artigo-preco').value),
                stock_atual: 0
            }]);

            if (error) alert("Erro: " + error.message);
            else {
                alert("Artigo criado!");
                e.target.reset();
            }
            btn.innerText = "CRIAR ARTIGO";
        });

        // --- GESTÃO DE FORNECEDORES ---
        async function loadFornecedores() {
    const lista = document.getElementById('lista-fornecedores');
    try {
        const { data, error } = await _supabase.from('Fornecedores').select('*');
        if (error) throw error;

        if (!data || data.length === 0) {
            lista.innerHTML = '<p class="text-slate-400 text-[10px]">Cria o teu primeiro fornecedor acima.</p>';
            return;
        }

        lista.innerHTML = data.map(f => `
            <span class="bg-slate-100 text-slate-500 px-3 py-2 rounded-lg border border-slate-200">${f.nome}</span>
        `).join('');
    } catch (e) {
        console.error(e);
    }
}

        async function addFornecedor() {
            const nome = document.getElementById('forn-nome').value;
            if(!nome) return;
            
            const { error } = await _supabase.from('fornecedores').insert([{ nome }]);
            if (error) alert(error.message);
            else {
                document.getElementById('forn-nome').value = '';
                loadFornecedores();
            }
        }

        document.addEventListener('DOMContentLoaded', loadFornecedores);
    </script>
</body>
</html>
